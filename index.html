<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0d1a">
<meta name="description" content="朋友间共用的购物审批小工具">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>朋友购物审批站</title>
<style>
/* ===== Reset & Variables ===== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0d0d1a;
  --bg-card: #1a1a2e;
  --bg-input: #16162a;
  --border: #2a2a3e;
  --border-light: #33334a;
  --primary: #7c3aed;
  --primary-light: #a78bfa;
  --secondary: #ec4899;
  --success: #22c55e;
  --success-bg: rgba(34, 197, 94, 0.15);
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.15);
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.15);
  --text: #f1f1f3;
  --text-secondary: #9ca3af;
  --text-tertiary: #6b7280;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
  --gradient: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
  --gradient-success: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
  --gradient-danger: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
  --max-width: 480px;
  --tabbar-h: 64px;
  --header-h: 56px;
}

html, body { height: 100%; }
body { overflow: hidden; }
/* iOS Safari 允许登录页滑动 */
.login-screen { overflow-y: auto; -webkit-overflow-scrolling: touch; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

#app {
  max-width: var(--max-width);
  margin: 0 auto;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ===== Header ===== */
.app-header {
  height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
}
.app-header h1 {
  font-size: 18px;
  font-weight: 700;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.user-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.user-badge:active { transform: scale(0.95); }
.user-badge .avatar { font-size: 18px; }

/* ===== Content ===== */
.app-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px;
  padding-bottom: calc(var(--tabbar-h) + 16px);
  -webkit-overflow-scrolling: touch;
}
.app-content::-webkit-scrollbar { width: 0; }

/* ===== Tab Bar ===== */
.tab-bar {
  height: var(--tabbar-h);
  display: flex;
  align-items: center;
  justify-content: space-around;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 6px;
  cursor: pointer;
  transition: all 0.2s;
  background: none;
  border: none;
  color: var(--text-tertiary);
  font-size: 10px;
  font-family: inherit;
  position: relative;
}
.tab-item .tab-icon { font-size: 20px; line-height: 1; }
.tab-item.active { color: var(--primary-light); }
.tab-item.active .tab-icon { transform: scale(1.15); }
.tab-badge {
  position: absolute;
  top: 2px;
  right: 6px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== Cards ===== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}

/* ===== Stats Grid ===== */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
}
.stat-card .stat-icon { font-size: 24px; margin-bottom: 6px; }
.stat-card .stat-value { font-size: 24px; font-weight: 700; margin-bottom: 2px; }
.stat-card .stat-label { font-size: 12px; color: var(--text-secondary); }

/* ===== Section Title ===== */
.section-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin: 20px 0 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
  width: 100%;
  font-family: inherit;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--gradient); color: #fff; }
.btn-success { background: var(--gradient-success); color: #fff; }
.btn-danger { background: var(--gradient-danger); color: #fff; }
.btn-ghost { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }

/* ===== Forms ===== */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 6px;
  font-weight: 500;
}
.form-input, .form-textarea, .form-select {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  transition: border-color 0.2s;
}
.form-input:focus, .form-textarea:focus, .form-select:focus { outline: none; border-color: var(--primary); }
.form-textarea { resize: none; min-height: 80px; }
.form-input::placeholder, .form-textarea::placeholder { color: var(--text-tertiary); }
.form-select { -webkit-appearance: none; appearance: none; }

.price-input-wrapper { position: relative; }
.price-input-wrapper .price-prefix {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-secondary);
  font-size: 14px;
  pointer-events: none;
}
.price-input-wrapper .form-input { padding-left: 28px; }

/* ===== Request Card ===== */
.request-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  animation: fadeInUp 0.3s ease;
}
.request-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.request-header .avatar {
  font-size: 28px;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-input);
  border-radius: 50%;
  flex-shrink: 0;
}
.request-header .user-info { flex: 1; }
.request-header .user-info .name { font-size: 14px; font-weight: 600; }
.request-header .user-info .time { font-size: 12px; color: var(--text-tertiary); }
.request-item { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.request-price { font-size: 20px; font-weight: 700; color: var(--secondary); margin-bottom: 8px; }
.request-reason { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; line-height: 1.5; }
.request-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--primary-light);
  text-decoration: none;
  margin-bottom: 8px;
}
.request-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

/* ===== Status Badge ===== */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}
.status-pending { background: var(--warning-bg); color: var(--warning); }
.status-approved { background: var(--success-bg); color: var(--success); }
.status-rejected { background: var(--danger-bg); color: var(--danger); }

/* ===== Action Row ===== */
.action-row { display: flex; gap: 10px; }
.action-row .btn { flex: 1; padding: 10px; font-size: 13px; }

/* ===== Approval Info ===== */
.approval-info {
  background: var(--bg-input);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  margin-top: 12px;
  font-size: 12px;
  color: var(--text-secondary);
}
.approval-info .approver {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}
.approval-info .comment { color: var(--text); font-style: italic; }

/* ===== 飞书评审模式 - 投票统计与列表 ===== */
.vote-summary {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  margin-bottom: 8px;
}
.vote-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
}
.vote-chip.approve { background: rgba(16,185,129,0.15); color: #34d399; }
.vote-chip.reject { background: rgba(239,68,68,0.15); color: #f87171; }
.vote-chip.pending { background: rgba(245,158,11,0.15); color: #fbbf24; }

.vote-list {
  margin-top: 8px;
  border-top: 1px solid var(--border);
  padding-top: 8px;
}
.vote-item {
  display: flex;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border-light);
}
.vote-item:last-child { border-bottom: none; }
.vote-item .vote-avatar { font-size: 20px; flex-shrink: 0; }
.vote-item .vote-body { flex: 1; min-width: 0; }
.vote-item .vote-head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 2px;
}
.vote-item .vote-name { font-weight: 600; font-size: 13px; }
.vote-item .vote-badge {
  font-size: 11px;
  padding: 1px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.vote-item .vote-badge.approve { background: rgba(16,185,129,0.15); color: #34d399; }
.vote-item .vote-badge.reject { background: rgba(239,68,68,0.15); color: #f87171; }
.vote-item .vote-time { font-size: 11px; color: var(--text-tertiary); margin-left: auto; }
.vote-item .vote-comment {
  font-size: 13px;
  color: var(--text);
  font-style: italic;
  margin-top: 2px;
}
.vote-item .vote-no-comment { font-size: 12px; color: var(--text-tertiary); }
.my-vote-tag {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  background: var(--gradient);
  color: #fff;
  margin-left: 4px;
  font-weight: 600;
}

/* ===== Filter Tabs ===== */
.filter-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-tabs::-webkit-scrollbar { display: none; }
.filter-tab {
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
}
.filter-tab.active { background: var(--gradient); color: #fff; border-color: transparent; }

/* ===== Empty State ===== */
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-tertiary);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.empty-state .empty-text { font-size: 14px; line-height: 1.6; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
.modal-sheet {
  width: 100%;
  max-width: var(--max-width);
  background: var(--bg-card);
  border-radius: 24px 24px 0 0;
  padding: 20px 16px 40px;
  animation: slideUp 0.3s ease;
  max-height: 80vh;
  overflow-y: auto;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.modal-header h3 { font-size: 17px; font-weight: 700; }
.modal-close {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--bg-input);
  border: none;
  color: var(--text-secondary);
  font-size: 16px;
  cursor: pointer;
}

/* ===== Toast ===== */
.toast-container {
  position: fixed;
  top: 64px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
  width: max-content;
  max-width: 90vw;
}
.toast {
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.2s forwards;
  white-space: nowrap;
}
.toast-success { background: var(--success-bg); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.3); }
.toast-error { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
.toast-info { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }

/* ===== Member Selector ===== */
.member-selector {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 4px 0 8px;
  scrollbar-width: none;
}
.member-selector::-webkit-scrollbar { display: none; }
.member-chip {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  border: 2px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
  min-width: 64px;
}
.member-chip.active { border-color: var(--primary); background: rgba(124, 58, 237, 0.1); }
.member-chip .chip-avatar { font-size: 28px; }
.member-chip .chip-name { font-size: 12px; color: var(--text-secondary); }
.member-chip.active .chip-name { color: var(--text); }

/* ===== Emoji Picker ===== */
.emoji-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 4px;
  margin: 8px 0;
}
.emoji-option {
  font-size: 22px;
  padding: 6px;
  border-radius: var(--radius-xs);
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  border: 2px solid transparent;
}
.emoji-option:hover { background: var(--bg-input); }
.emoji-option.selected { border-color: var(--primary); background: rgba(124, 58, 237, 0.1); }

/* ===== Role Toggle ===== */
.role-toggle { display: flex; gap: 8px; }
.role-option {
  flex: 1;
  padding: 10px;
  text-align: center;
  border-radius: var(--radius-sm);
  background: var(--bg-input);
  border: 1px solid var(--border);
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  transition: all 0.2s;
}
.role-option.active { background: rgba(124, 58, 237, 0.15); border-color: var(--primary); color: var(--primary-light); }

/* ===== Member Card ===== */
.member-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
}
.member-card .mc-avatar {
  font-size: 28px;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-card);
  border-radius: 50%;
  flex-shrink: 0;
}
.member-card .mc-info { flex: 1; }
.member-card .mc-name { font-size: 14px; font-weight: 600; }
.member-card .mc-roles { display: flex; gap: 4px; margin-top: 2px; }
.member-card .mc-remove {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--danger-bg);
  border: none;
  color: var(--danger);
  font-size: 14px;
  cursor: pointer;
  flex-shrink: 0;
}

/* ===== Greeting ===== */
.greeting { margin-bottom: 20px; }
.greeting .greeting-text { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.greeting .greeting-sub { font-size: 13px; color: var(--text-secondary); }

.role-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
  margin-left: 8px;
  vertical-align: middle;
}
.role-badge.applicant { background: rgba(124, 58, 237, 0.15); color: var(--primary-light); }
.role-badge.approver { background: rgba(236, 72, 153, 0.15); color: var(--secondary); }
.role-badge.admin { background: rgba(245, 158, 11, 0.15); color: var(--warning); }

/* ===== Activity Item ===== */
.activity-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.activity-item:last-child { border-bottom: none; }
.activity-item .ai-avatar {
  font-size: 24px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-input);
  border-radius: 50%;
  flex-shrink: 0;
}
.activity-item .ai-content { flex: 1; font-size: 13px; }
.activity-item .ai-text { color: var(--text); line-height: 1.4; }
.activity-item .ai-text strong { font-weight: 600; }
.activity-item .ai-meta { color: var(--text-tertiary); font-size: 12px; margin-top: 2px; }

/* ===== Quick Action ===== */
.quick-action { margin-bottom: 20px; }

/* ===== Toggle Switch ===== */
.mc-toggles { display: flex; gap: 16px; margin-top: 6px; flex-wrap: wrap; }
.mc-toggle-group { display: flex; align-items: center; gap: 6px; }
.mc-toggle-label { font-size: 12px; color: var(--text-secondary); }
.toggle-switch {
  position: relative;
  width: 40px;
  height: 22px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}
.toggle-switch .toggle-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  background: var(--text-tertiary);
  border-radius: 50%;
  transition: all 0.2s;
}
.toggle-switch.on { background: rgba(124, 58, 237, 0.3); border-color: var(--primary); }
.toggle-switch.on .toggle-thumb { left: 20px; background: var(--primary-light); }
.toggle-switch.on.role-approver { background: rgba(236, 72, 153, 0.3); border-color: var(--secondary); }
.toggle-switch.on.role-approver .toggle-thumb { background: var(--secondary); }

/* ===== Quick Switch List ===== */
.quick-switch-list { display: flex; flex-direction: column; gap: 8px; }
.quick-switch-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--bg-input);
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
}
.quick-switch-item:active { transform: scale(0.98); }
.quick-switch-item.active { border-color: var(--primary); background: rgba(124, 58, 237, 0.08); }
.quick-switch-item .qs-avatar {
  font-size: 28px; width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-card); border-radius: 50%; flex-shrink: 0;
}
.quick-switch-item .qs-info { flex: 1; }
.quick-switch-item .qs-name { font-size: 14px; font-weight: 600; }
.quick-switch-item .qs-roles { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.quick-switch-item .qs-check { color: var(--primary-light); font-size: 18px; font-weight: 700; opacity: 0; }
.quick-switch-item.active .qs-check { opacity: 1; }

/* ===== Emoji Scroll ===== */
.emoji-grid-scroll { max-height: 160px; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.emoji-grid-scroll::-webkit-scrollbar { display: none; }

<script>
/* ============================================================
 * 朋友购物审批站 - Supabase 实时同步版
 * 数据存储在 Supabase PostgreSQL，通过 Realtime 实时同步
 * ============================================================ */

/* ===== 配置 ===== */
var AVATAR_EMOJIS = ['🐱','🐶','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🦄','🐴','🐲','🦕','🦖','🐙','🦋','🐳','🐬','🦈','🦒','🐘','🦏','🦓','🦔','🐰','🐹','🐭','🐢','🦉','🦅','🦜','🦢','🦩','🐣','🐥','🐝','😀','😎','🤓','🥳','🤪','😜','🤠','👻','🤡','👽','🤖','🎃','😈','👼','🦸','🦹','🥷','🧙','🧚','🧛','🧜','🧝'];

var TABS = [
  { id: 'home',     label: '首页', icon: '🏠' },
  { id: 'submit',   label: '申请', icon: '📝' },
  { id: 'approval',  label: '审批', icon: '✅' },
  { id: 'history',  label: '记录', icon: '📋' },
  { id: 'mine',     label: '我的', icon: '👤' },
  { id: 'settings', label: '设置', icon: '⚙️' }
];

var TAB_LABELS = { home: '朋友购物审批站', submit: '发起申请', approval: '审批队列', history: '消费记录', mine: '我的记录', settings: '设置' };

/* ===== 状态 ===== */
var state = {
  view: 'home',
  currentUser: null,
  historyFilter: 'all',
  selectedEmoji: '🐱',
  newMemberRole: { isApplicant: true, isApprover: false },
  modalSelectedEmoji: '🐱',
  modalRoles: { isApplicant: true, isApprover: false },
  loginMode: 'login',
  loginSelectedEmoji: '🐱',
  serverConnected: false,
  mineFilter: 'all'
};

/* ===== 通知系统：标签提醒 + 声音提醒 + 弹窗 ===== */
var NotificationSystem = {
  soundEnabled: true,
  originalTitle: '朋友购物审批站',
  lastNotifyTime: 0,

  /* 播放提示音（Web Audio API，无需外部文件） */
  playSound: function() {
    if (!this.soundEnabled) return;
    try {
      var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      /* 两个音节"叮咚" */
      var notes = [
        { freq: 880, delay: 0, duration: 0.15 },
        { freq: 660, delay: 0.12, duration: 0.2 }
      ];
      notes.forEach(function(note) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = note.freq;
        osc.type = 'sine';
        var startTime = audioCtx.currentTime + note.delay;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.3, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + note.duration);
        osc.start(startTime);
        osc.stop(startTime + note.duration);
      });
    } catch (e) { /* 静默失败 */ }
  },

  /* 发送通知：声音 + Toast + 浏览器通知 */
  notify: function(type, title, message) {
    var now = Date.now();
    /* 防抖：3秒内不重复通知 */
    if (now - this.lastNotifyTime < 3000) return;
    this.lastNotifyTime = now;

    /* 播放声音 */
    this.playSound();

    /* 显示Toast */
    showToast(title + '\n' + message, type === 'new_request' ? 'success' : 'info');

    /* 浏览器原生通知（需要授权） */
    if ('Notification' in window && Notification.permission === 'granted') {
      try {
        var n = new Notification(title, {
          body: message,
          icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🛒</text></svg>',
          tag: type
        });
        n.onclick = function() { window.focus(); n.close(); };
      } catch (e) { /* 静默失败 */ }
    }
  },

  /* 更新标签标题：显示待评审数量 */
  updateTabTitle: function(requests, user) {
    if (!user) {
      document.title = this.originalTitle;
      return;
    }
    var pendingCount = requests.filter(function(r) {
      return r.applicantId !== user.id && r.status === 'pending';
    }).length;

    /* 自己申请被投票但还没通过的也算 */
    var myVotedRequests = requests.filter(function(r) {
      if (r.applicantId !== user.id) return false;
      var votes = r.votes || [];
      return votes.length > 0 && r.status === 'pending';
    }).length;

    var totalBadge = pendingCount + myVotedRequests;
    if (totalBadge > 0) {
      document.title = '(' + totalBadge + ') ' + this.originalTitle;
    } else {
      document.title = this.originalTitle;
    }
  },

  /* 请求浏览器通知权限 */
  requestPermission: function() {
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  }
};

/* ===== Supabase 配置 ===== */
var SUPABASE_URL = 'https://klynsbdhtrpmfknzufvc.supabase.co';
var SUPABASE_KEY = 'sb_publishable_yi8_gBrWGVY-VBSHC-3vuw_eboErvDl';
var sb = null;

/* ===== 数据映射（snake_case → camelCase） ===== */
function mapMember(m) {
  if (!m) return null;
  return { id: m.id, name: m.name, avatar: m.avatar,
    isApplicant: m.is_applicant, isApprover: m.is_approver, isAdmin: m.is_admin, pin: m.pin };
}
function mapRequest(r) {
  if (!r) return null;
  return { id: r.id,
    applicantId: r.applicant_id, applicantName: r.applicant_name, applicantAvatar: r.applicant_avatar,
    item: r.item, price: Number(r.price), reason: r.reason, link: r.link || '',
    imageUrl: r.image_url || '',
    status: r.status, votes: r.votes || [],
    approverId: r.approver_id, approverName: r.approver_name, approverAvatar: r.approver_avatar,
    comment: r.comment,
    createdAt: r.created_at ? new Date(r.created_at).getTime() : Date.now(),
    decidedAt: r.decided_at ? new Date(r.decided_at).getTime() : null };
}
function mapFavorite(f) {
  if (!f) return null;
  return { id: f.id, userId: f.user_id, requestId: f.request_id,
    createdAt: f.created_at ? new Date(f.created_at).getTime() : Date.now() };
}

/* ===== 数据层（Supabase） ===== */
var DB = {
  data: { members: [], requests: [], favorites: [] },

  init: function() {
    state.currentUser = localStorage.getItem('fsp-user-id');
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    this.loadAll();
    this.subscribe();
  },

  loadAll: function() {
    var self = this;
    Promise.all([
      sb.from('members').select('*'),
      sb.from('requests').select('*').order('created_at', { ascending: false })
    ]).then(function(results) {
      self.data.members = (results[0].data || []).map(mapMember);
      self.data.requests = (results[1].data || []).map(mapRequest);
      state.serverConnected = true;
      if (state.currentUser && !self.getMember(state.currentUser)) {
        state.currentUser = null;
        localStorage.removeItem('fsp-user-id');
      }
      /* 首次加载更新标签标题 */
      var curUser = state.currentUser ? self.getMember(state.currentUser) : null;
      NotificationSystem.updateTabTitle(self.data.requests, curUser);
      /* 单独加载收藏（表可能还没建，不阻塞主流程） */
      sb.from('favorites').select('*').order('created_at', { ascending: false }).then(function(result) {
        self.data.favorites = (result.data || []).map(mapFavorite);
        render();
      }).catch(function() {
        self.data.favorites = [];
        render();
      });
      render();
    }).catch(function(err) {
      state.serverConnected = false;
      render();
    });
  },

  subscribe: function() {
    var self = this;
    sb.channel('members-ch').on('postgres_changes', { event: '*', schema: 'public', table: 'members' }, function() {
      self.refreshMembers();
    }).subscribe();
    sb.channel('requests-ch').on('postgres_changes', { event: '*', schema: 'public', table: 'requests' }, function() {
      self.refreshRequests(true); /* true = 来自实时推送 */
    }).subscribe();
    sb.channel('favorites-ch').on('postgres_changes', { event: '*', schema: 'public', table: 'favorites' }, function() {
      self.refreshFavorites();
    }).subscribe();
  },

  refreshMembers: function() {
    var self = this;
    sb.from('members').select('*').then(function(result) {
      self.data.members = (result.data || []).map(mapMember);
      if (state.currentUser && !self.getMember(state.currentUser)) {
        state.currentUser = null;
        localStorage.removeItem('fsp-user-id');
      }
      render();
    });
  },

  refreshRequests: function(isRealtime) {
    var self = this;
    /* 记录旧数据用于检测变化 */
    var oldRequests = self.data.requests;
    var oldRequestIds = oldRequests.map(function(r) { return r.id; });
    var oldVoteCounts = {};
    oldRequests.forEach(function(r) {
      var votes = r.votes || [];
      oldVoteCounts[r.id] = votes.length;
    });

    sb.from('requests').select('*').order('created_at', { ascending: false }).then(function(result) {
      self.data.requests = (result.data || []).map(mapRequest);
      var newRequests = self.data.requests;

      /* 实时推送时检测新申请和新投票 */
      if (isRealtime && state.currentUser) {
        var user = state.currentUser;

        /* 检测新申请（不是自己发起的） */
        var newForMe = newRequests.filter(function(r) {
          return r.applicantId !== user.id && oldRequestIds.indexOf(r.id) < 0;
        });
        if (newForMe.length > 0) {
          var names = newForMe.map(function(r) { return r.applicantName; }).join('、');
          NotificationSystem.notify('new_request', newForMe.length + '条新申请待评审', names + ' 提交了新申请');
        }

        /* 检测自己的申请有新投票 */
        newRequests.forEach(function(r) {
          if (r.applicantId === user.id) {
            var newVoteCount = (r.votes || []).length;
            var oldCount = oldVoteCounts[r.id] || 0;
            if (newVoteCount > oldCount) {
              var latestVote = (r.votes || [])[newVoteCount - 1];
              if (latestVote && latestVote.userId !== user.id) {
                var decision = latestVote.decision === 'approved' ? '✅通过' : '❌驳回';
                NotificationSystem.notify('new_vote', latestVote.userName + ' ' + decision + '了你的申请',
                  '"' + r.item + '" — ' + (latestVote.comment || '未填写意见'));
              }
            }
          }
        });
      }

      /* 更新标签标题 */
      NotificationSystem.updateTabTitle(newRequests, state.currentUser);

      render();
    });
  },

  refreshFavorites: function() {
    var self = this;
    sb.from('favorites').select('*').order('created_at', { ascending: false }).then(function(result) {
      self.data.favorites = (result.data || []).map(mapFavorite);
      render();
    }).catch(function() {
      self.data.favorites = [];
    });
  },

  getMembers: function() { return this.data.members; },
  getMember: function(id) { return this.data.members.find(function(m) { return m.id === id; }); },
  getCurrentUser: function() { return this.getMember(state.currentUser); },

  getPendingRequests: function() {
    return this.data.requests.filter(function(r) { return r.status === 'pending'; });
  },
  getFilteredRequests: function(filter) {
    if (filter === 'all') return this.data.requests;
    return this.data.requests.filter(function(r) { return r.status === filter; });
  },
  getRecentActivity: function(limit) {
    return this.data.requests.slice().sort(function(a, b) {
      var aT = a.decidedAt || a.createdAt;
      var bT = b.decidedAt || b.createdAt;
      return bT - aT;
    }).slice(0, limit || 5);
  },
  getStats: function() {
    var all = this.data.requests;
    var pending = all.filter(function(r) { return r.status === 'pending'; });
    var approved = all.filter(function(r) { return r.status === 'approved'; });
    var rejected = all.filter(function(r) { return r.status === 'rejected'; });
    var totalSpent = approved.reduce(function(sum, r) { return sum + r.price; }, 0);
    var monthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime();
    var monthSpent = approved.filter(function(r) { return (r.decidedAt || 0) >= monthStart; })
      .reduce(function(sum, r) { return sum + r.price; }, 0);
    return {
      pending: pending.length,
      approved: approved.length,
      rejected: rejected.length,
      totalSpent: totalSpent,
      monthSpent: monthSpent,
      approvalRate: (approved.length + rejected.length) > 0
        ? Math.round(approved.length / (approved.length + rejected.length) * 100) : 0
    };
  },
  isCurrentUserAdmin: function() {
    var user = this.getCurrentUser();
    return !!(user && user.isAdmin);
  },

  /* --- 个人记录查询 --- */
  getMyRequests: function() {
    var user = this.getCurrentUser();
    if (!user) return [];
    return this.data.requests.filter(function(r) { return r.applicantId === user.id; });
  },
  getMyApprovals: function() {
    var user = this.getCurrentUser();
    if (!user) return [];
    return this.data.requests.filter(function(r) {
      var votes = r.votes || [];
      return votes.some(function(v) { return v.userId === user.id && v.decision === 'approved'; });
    });
  },
  getMyRejections: function() {
    var user = this.getCurrentUser();
    if (!user) return [];
    return this.data.requests.filter(function(r) {
      var votes = r.votes || [];
      return votes.some(function(v) { return v.userId === user.id && v.decision === 'rejected'; });
    });
  },
  /* 他人通过我的申请 */
  getApprovedByOthers: function() {
    var user = this.getCurrentUser();
    if (!user) return [];
    return this.data.requests.filter(function(r) {
      return r.applicantId === user.id && r.status === 'approved';
    });
  },
  /* 他人驳回我的申请 */
  getRejectedByOthers: function() {
    var user = this.getCurrentUser();
    if (!user) return [];
    return this.data.requests.filter(function(r) {
      return r.applicantId === user.id && r.status === 'rejected';
    });
  },
  getMyStats: function() {
    var user = this.getCurrentUser();
    if (!user) return { applied: 0, approved: 0, rejected: 0, approvedRate: 0, myTotalSpent: 0 };
    var all = this.data.requests;
    var myApplied = all.filter(function(r) { return r.applicantId === user.id; });
    var myApproved = all.filter(function(r) {
      var votes = r.votes || [];
      return votes.some(function(v) { return v.userId === user.id && v.decision === 'approved'; });
    });
    var myRejected = all.filter(function(r) {
      var votes = r.votes || [];
      return votes.some(function(v) { return v.userId === user.id && v.decision === 'rejected'; });
    });
    var decided = myApproved.length + myRejected.length;
    var myApprovedApplications = all.filter(function(r) { return r.applicantId === user.id && r.status === 'approved'; });
    return {
      applied: myApplied.length,
      approved: myApproved.length,
      rejected: myRejected.length,
      approvedRate: decided > 0 ? Math.round(myApproved.length / decided * 100) : 0,
      myTotalSpent: myApprovedApplications.reduce(function(sum, r) { return sum + r.price; }, 0)
    };
  },

  /* --- 个人消费总额 --- */
  getMyTotalSpent: function() {
    var user = this.getCurrentUser();
    if (!user) return 0;
    return this.data.requests
      .filter(function(r) { return r.applicantId === user.id && r.status === 'approved'; })
      .reduce(function(sum, r) { return sum + r.price; }, 0);
  },

  /* --- 管理员：所有成员消费统计 --- */
  getAllMembersStats: function() {
    var self = this;
    return this.data.members.map(function(m) {
      var myApprovedReqs = self.data.requests.filter(function(r) {
        return r.applicantId === m.id && r.status === 'approved';
      });
      var myAppliedCount = self.data.requests.filter(function(r) {
        return r.applicantId === m.id;
      }).length;
      return {
        id: m.id, name: m.name, avatar: m.avatar,
        totalSpent: myApprovedReqs.reduce(function(sum, r) { return sum + r.price; }, 0),
        approvedCount: myApprovedReqs.length,
        appliedCount: myAppliedCount
      };
    }).sort(function(a, b) { return b.totalSpent - a.totalSpent; });
  },

  /* --- 收藏功能 --- */
  getMyFavorites: function() {
    var user = this.getCurrentUser();
    if (!user) return [];
    var favIds = this.data.favorites
      .filter(function(f) { return f.userId === user.id; })
      .map(function(f) { return f.requestId; });
    return this.data.requests.filter(function(r) { return favIds.indexOf(r.id) !== -1; });
  },
  isFavorited: function(requestId) {
    var user = this.getCurrentUser();
    if (!user) return false;
    return this.data.favorites.some(function(f) {
      return f.userId === user.id && f.requestId === requestId;
    });
  },
  toggleFavorite: function(requestId) {
    var user = this.getCurrentUser();
    if (!user) return;
    var existing = this.data.favorites.find(function(f) {
      return f.userId === user.id && f.requestId === requestId;
    });
    if (existing) {
      sb.from('favorites').delete().eq('id', existing.id).then(function() {}).catch(function() {
        showToast('取消收藏失败，请先在Supabase运行建表SQL', 'error');
      });
    } else {
      var id = 'f' + Date.now();
      sb.from('favorites').insert({
        id: id, user_id: user.id, request_id: requestId
      }).then(function() {}).catch(function() {
        showToast('收藏失败，请先在Supabase运行建表SQL', 'error');
      });
    }
  },

  /* --- 写操作：直接 Supabase 查询 --- */
  addRequest: function(item, price, reason, link, imageUrl) {
    var user = this.getCurrentUser();
    if (!user) return null;
    var id = 'r' + Date.now();
    sb.from('requests').insert({
      id: id,
      applicant_id: user.id, applicant_name: user.name, applicant_avatar: user.avatar,
      item: item, price: price, reason: reason, link: link || '',
      image_url: imageUrl || '',
      status: 'pending', votes: []
    }).then(function(result) {
      if (result.error) showToast(result.error.message, 'error');
    });
    return true;
  },

  voteRequest: function(requestId, decision, comment) {
    var user = this.getCurrentUser();
    if (!user) return false;
    var req = this.data.requests.find(function(r) { return r.id === requestId; });
    if (!req) return false;
    if (req.applicantId === user.id) { showToast('不能审批自己的申请', 'error'); return false; }

    var votes = req.votes || [];
    /* 检查是否已投过票（改票） */
    var existingIdx = -1;
    for (var i = 0; i < votes.length; i++) {
      if (votes[i].userId === user.id) { existingIdx = i; break; }
    }
    var newVote = {
      userId: user.id, userName: user.name, userAvatar: user.avatar,
      decision: decision, comment: comment || '', votedAt: Date.now(),
      imageUrl: voteImageUrl || null
    };
    if (existingIdx >= 0) {
      votes[existingIdx] = newVote;
    } else {
      votes.push(newVote);
    }

    /* 计算最终状态：通过人数 > 驳回人数 才通过，反之驳回，相等则继续待定 */
    var approveCount = votes.filter(function(v) { return v.decision === 'approved'; }).length;
    var rejectCount = votes.filter(function(v) { return v.decision === 'rejected'; }).length;
    var newStatus;
    if (approveCount > rejectCount) {
      newStatus = 'approved';
    } else if (rejectCount > approveCount) {
      newStatus = 'rejected';
    } else {
      newStatus = 'pending';
    }

    var updateData = {
      votes: votes,
      status: newStatus,
      decided_at: newStatus !== 'pending' ? new Date().toISOString() : null
    };
    /* 如果最终决定，记录最后决定者 */
    if (newStatus !== 'pending') {
      updateData.approver_id = user.id;
      updateData.approver_name = user.name;
      updateData.approver_avatar = user.avatar;
      updateData.comment = comment || '';
    }

    /* 立即更新本地数据，不用等实时推送回来 */
    req.votes = votes;
    req.status = newStatus;
    if (newStatus !== 'pending') {
      req.approverId = user.id;
      req.approverName = user.name;
      req.approverAvatar = user.avatar;
      req.comment = comment || '';
      req.decidedAt = Date.now();
    }

    sb.from('requests').update(updateData).eq('id', requestId).then(function(result) {
      if (result.error) showToast(result.error.message, 'error');
    });
    return true;
  },

  addMember: function(name, avatar, isApplicant, isApprover) {
    var id = 'm' + Date.now();
    sb.from('members').insert({
      id: id, name: name, avatar: avatar || '🐱',
      is_applicant: true, is_approver: true, is_admin: false, pin: '0000'
    }).then(function(result) {
      if (result.error) showToast(result.error.message, 'error');
    });
    return id;
  },

  removeMember: function(id) {
    var member = this.getMember(id);
    if (member && member.isAdmin) return;
    if (this.data.members.length <= 1) return;
    sb.from('members').delete().eq('id', id).then(function(result) {
      if (result.error) showToast(result.error.message, 'error');
    });
    if (state.currentUser === id) {
      state.currentUser = null;
      localStorage.removeItem('fsp-user-id');
    }
  },

  toggleMemberRole: function(id, role) {
    var member = this.getMember(id);
    if (!member) return false;
    var wouldBeApplicant = role === 'isApplicant' ? !member.isApplicant : member.isApplicant;
    var wouldBeApprover = role === 'isApprover' ? !member.isApprover : member.isApprover;
    if (!wouldBeApplicant && !wouldBeApprover) return false;
    var update = {};
    if (role === 'isApplicant') update.is_applicant = !member.isApplicant;
    if (role === 'isApprover') update.is_approver = !member.isApprover;
    sb.from('members').update(update).eq('id', id).then(function(result) {
      if (result.error) showToast(result.error.message, 'error');
    });
    return true;
  },

  updateMemberName: function(id, name) {
    if (!name) return false;
    sb.from('members').update({ name: name }).eq('id', id).then(function(result) {
      if (result.error) showToast(result.error.message, 'error');
    });
    return true;
  },

  updateMember: function(id, updates) {
    var self = this;
    var sbUpdates = {};
    if (updates.pin !== undefined) sbUpdates.pin = updates.pin;
    if (updates.name !== undefined) sbUpdates.name = updates.name;
    if (updates.avatar !== undefined) sbUpdates.avatar = updates.avatar;
    if (updates.is_applicant !== undefined) sbUpdates.is_applicant = updates.is_applicant;
    if (updates.is_approver !== undefined) sbUpdates.is_approver = updates.is_approver;
    if (updates.is_admin !== undefined) sbUpdates.is_admin = updates.is_admin;
    return sb.from('members').update(sbUpdates).eq('id', id).then(function(result) {
      if (result.error) { showToast(result.error.message, 'error'); throw result.error; }
      var m = self.getMember(id);
      if (m) { Object.keys(updates).forEach(function(k) { m[k] = updates[k]; }); }
      render();
    });
  },

  deleteRequest: function(requestId) {
    sb.from('requests').delete().eq('id', requestId).then(function(result) {
      if (result.error) showToast(result.error.message, 'error');
    });
  },

  clearAllData: function() {
    sb.from('requests').delete().neq('id', '').then(function() {
      sb.from('members').delete().neq('id', 'm1').then(function(result) {
        if (result.error) showToast(result.error.message, 'error');
      });
    });
  }
};

/* ===== 认证函数 ===== */
function handleRegister() {
  var name = document.getElementById('reg-name').value.trim();
  var pin = document.getElementById('reg-pin').value.trim();
  var pinConfirm = document.getElementById('reg-pin-confirm').value.trim();

  if (!name) { showToast('请输入昵称', 'error'); return; }
  if (name.length > 10) { showToast('昵称最多10个字', 'error'); return; }
  if (!pin || pin.length !== 4 || !/^\d{4}$/.test(pin)) { showToast('PIN码必须是4位数字', 'error'); return; }
  if (pin !== pinConfirm) { showToast('两次PIN码不一致', 'error'); return; }
  if (DB.data.members.find(function(m) { return m.name === name; })) {
    showToast('这个名字已被使用', 'error'); return;
  }

  var id = 'm' + Date.now();
  sb.from('members').insert({
    id: id, name: name, avatar: state.loginSelectedEmoji,
    is_applicant: true, is_approver: true, is_admin: false, pin: pin
  }).then(function(result) {
    if (result.error) { showToast(result.error.message, 'error'); return; }
    state.currentUser = id;
    localStorage.setItem('fsp-user-id', id);
    showToast('注册成功，欢迎 ' + name + '！', 'success');
    render();
  }).catch(function() { showToast('网络错误，请重试', 'error'); });
}

function handleLogin() {
  var memberId = document.getElementById('login-name').value;
  var pin = document.getElementById('login-pin').value.trim();

  if (!memberId) { showToast('请选择身份', 'error'); return; }
  if (!pin) { showToast('请输入PIN码', 'error'); return; }

  var member = DB.getMember(memberId);
  if (!member) { showToast('用户不存在', 'error'); return; }
  if (member.pin !== pin) { showToast('PIN码错误', 'error'); return; }

  localStorage.setItem('fsp-user-id', member.id);
  showToast('登录成功，欢迎回来 ' + member.name + '！', 'success');
  /* 请求浏览器通知权限 */

  /* 更新标签标题 */
  NotificationSystem.updateTabTitle(DB.data.requests, member);
  render();
}

  localStorage.removeItem('fsp-user-id');
  document.title = NotificationSystem.originalTitle;

}

/* ===== 图片上传处理 ===== */
var voteImageFile = null;     /* 待上传的压缩后图片Blob */
var voteImageUrl = null;      /* 已上传的图片URL（改票时已有的） */
var voteImageRemoved = false; /* 改票时是否删除了旧图片 */

var requestImageUrl = null;  /* 申请时上传的图片URL */
var requestImageRemoved = false;

/* 压缩图片：最大800px宽，JPEG 0.7质量，目标<500KB */
function compressImage(file, callback) {
  if (!file || !file.type.startsWith('image/')) {
    showToast('请选择图片文件', 'error');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxDim = 800;
      var w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = h * maxDim / w; w = maxDim; }
        else { w = w * maxDim / h; h = maxDim; }
      }
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      canvas.toBlob(function(blob) {
        callback(blob);
      }, 'image/jpeg', 0.7);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* 上传图片到Supabase Storage */
function uploadVoteImage(blob, callback) {
  var fileName = 'vote_' + Date.now() + '_' + Math.floor(Math.random() * 10000) + '.jpg';
  sb.storage.from('vote-images').upload(fileName, blob, {
    contentType: 'image/jpeg',
    cacheControl: '3600'
  }).then(function(result) {
    if (result.error) {
      showToast('图片上传失败: ' + result.error.message, 'error');
      callback(null);
    } else {
      var url = sb.storage.from('vote-images').getPublicUrl(fileName).data.publicUrl;
      callback(url);
    }
  }).catch(function(err) {
    showToast('图片上传失败', 'error');
    callback(null);
  });
}

/* 处理图片选择 */
function handleImageSelect(input) {
  var file = input.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) {
    showToast('图片太大，请选小于10MB的图片', 'error');
    return;
  }
  var area = document.getElementById('img-upload-area');
  area.innerHTML = '<div class="img-uploading"><span class="spinner">⟳</span> 压缩中...</div>';
  compressImage(file, function(blob) {
    if (!blob) { resetImageUpload(); return; }
    area.innerHTML = '<div class="img-uploading"><span class="spinner">⟳</span> 上传中...</div>';
    uploadVoteImage(blob, function(url) {
      if (!url) { resetImageUpload(); return; }
      voteImageFile = null;
      voteImageUrl = url;
      voteImageRemoved = false;
      area.innerHTML =
        '<div class="img-preview-wrapper">' +
          '<img src="' + url + '" class="img-preview" style="max-height:150px">' +
          '<button class="img-remove-btn" data-action="remove-vote-image">✕</button>' +
        '</div>';
      area.classList.add('has-img');
    });
  });
}

/* 重置图片上传区域 */
function resetImageUpload() {
  voteImageFile = null;
  voteImageUrl = null;
  voteImageRemoved = true;
  var area = document.getElementById('img-upload-area');
  if (area) {
    area.classList.remove('has-img');
    area.innerHTML =
      '<div class="img-upload-icon">📷</div>' +
      '<div class="img-upload-hint">点击上传图片（选填）</div>' +
      '<input type="file" accept="image/*" capture="environment" style="display:none" data-action="select-vote-image">';
  }
}

/* ===== 工具函数 ===== */
var Utils = {
  formatPrice: function(price) {
    var num = Number(price);
    if (num >= 10000) return '¥' + (num / 10000).toFixed(1) + '万';
    return '¥' + num.toLocaleString('zh-CN');
  },
  formatTime: function(ts) {
    if (!ts) return '';
    var diff = Date.now() - ts;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
    if (diff < 86400000 * 7) return Math.floor(diff / 86400000) + '天前';
    var d = new Date(ts);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  },
  escapeHtml: function(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
};

/* ===== Toast ===== */
function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toast-container');
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 2600);
}

function showShareModal(requestId) {
  var req = DB.data.requests.find(function(r) { return r.id === requestId; });
  if (!req) return;

  var votes = req.votes || [];
  var approveCount = votes.filter(function(v) { return v.decision === 'approved'; }).length;
  var rejectCount = votes.filter(function(v) { return v.decision === 'rejected'; }).length;

  var shareText = '🌸 朋友安利时间！\n\n' +
    req.applicantAvatar + ' ' + req.applicantName + ' 推荐：\n' +
    '📦 ' + req.item + '\n' +
    '💰 ' + Utils.formatPrice(req.price) + '\n';
  if (req.reason) shareText += '💬 理由：' + req.reason + '\n';
  if (req.link) shareText += '🔗 ' + req.link + '\n';
  shareText += '\n✅ 已通过审批！';
  if (votes.length > 0) {
    shareText += '（' + approveCount + '人通过';
    if (rejectCount > 0) shareText += '，' + rejectCount + '人驳回';
    shareText += '）\n';
    /* 列出投票意见 */
    votes.forEach(function(v) {
      shareText += v.userAvatar + ' ' + v.userName + '：' + (v.decision === 'approved' ? '✅' : '❌');
      if (v.comment) shareText += ' - "' + v.comment + '"';
      if (v.imageUrl) shareText += ' [附图]';
      shareText += '\n';
    });
  } else {
    shareText += '\n';
  }
  shareText += '\n—— 来自「朋友购物审批站」';

  var encodedText = encodeURIComponent(shareText);
  var hasNativeShare = typeof navigator.share === 'function' || typeof navigator.canShare === 'function';
  var overlay = document.getElementById('modal-overlay');
  overlay.innerHTML =
    '<div class="modal-sheet">' +
      '<div class="modal-header">' +
        '<h3>📤 分享安利</h3>' +
        '<button class="modal-close" data-action="close-modal">✕</button>' +
      '</div>' +
      '<div class="share-preview">' + Utils.escapeHtml(shareText).replace(/\n/g, '<br>') + '</div>' +
      '<button class="btn btn-primary" data-action="copy-share" data-text="' + encodedText + '">📋 复制文字到剪贴板</button>' +
      (hasNativeShare
        ? '<button class="btn btn-ghost" data-action="native-share" data-text="' + encodedText + '" style="margin-top:8px">📤 系统分享（可发微信）</button>'
        : '<div style="margin-top:8px;padding:10px;background:var(--bg-input);border-radius:var(--radius-sm);font-size:12px;color:var(--text-secondary);text-align:center;line-height:1.6">💡 复制后打开微信，在聊天框长按粘贴即可发送</div>') +
    '</div>';
  overlay.classList.add('active');
}

function handleCopyShare(encodedText) {
  var text = decodeURIComponent(encodedText);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() {
      showToast('已复制到剪贴板', 'success');
    }).catch(function() {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('已复制到剪贴板', 'success');
  } catch (e) {
    showToast('复制失败，请手动复制', 'error');
  }
  document.body.removeChild(ta);
}

function handleNativeShare(encodedText) {
  var text = decodeURIComponent(encodedText);
  if (navigator.share) {
    navigator.share({ title: '朋友安利', text: text }).then(function() {
      showToast('分享成功', 'success');
    }).catch(function() {
      /* 用户取消分享，不做任何操作 */
    });
  } else {
    handleCopyShare(encodedText);
    showToast('已复制，打开微信粘贴即可发送', 'info');
  }
}

function renderApproval() {
  var user = DB.getCurrentUser();

  if (!user) return '<div class="empty-state"><div class="empty-icon">👤</div><div class="empty-text">请先登录</div></div>';

  /* 飞书评审模式：显示所有非自己发起的申请（不限状态，都可投票） */
  var allRequests = DB.data.requests;
  var votable = allRequests.filter(function(r) { return r.applicantId !== user.id; });
  var myOwn = allRequests.filter(function(r) { return r.applicantId === user.id; });

  if (votable.length === 0 && myOwn.length === 0) {
    return '<div class="empty-state"><div class="empty-icon">🎉</div><div class="empty-text">还没有任何申请<br>快去发起第一个吧</div></div>';
  }

  var html = '';
  if (votable.length > 0) {
    html += '<div style="margin-bottom:12px;color:var(--text-secondary);font-size:13px">' +
      '📌 飞书评审模式：所有人都能投票，意见实时可见，一人通过即生效' +
    '</div>';
    html += votable.map(function(r) { return renderRequestCard(r, { showActions: true }); }).join('');

  if (myOwn.length > 0) {
    html += '<div class="section-title">⏳ 我的待审申请</div>';
    html += myOwn.map(function(r) { return renderRequestCard(r, { showActions: true }); }).join('');
  }
  return html;
}

/* ===== 组件渲染 ===== */
function renderRequestCard(req, options) {
  options = options || {};
  var user = DB.getCurrentUser();
  var badgeMap = {
    pending:  '<span class="status-badge status-pending">⏳ 待审批</span>',
    approved: '<span class="status-badge status-approved">✅ 已通过</span>',
    rejected: '<span class="status-badge status-rejected">❌ 已驳回</span>'
  };
  var statusBadge = badgeMap[req.status] || '';

  var footer = '';
  var votes = req.votes || [];
  var approveVotes = votes.filter(function(v) { return v.decision === 'approved'; });
  var rejectVotes = votes.filter(function(v) { return v.decision === 'rejected'; });
  var myVote = user ? votes.find(function(v) { return v.userId === user.id; }) : null;
  var hasVoted = !!myVote;

  /* 投票统计条（有投票时显示） */
  var voteSummaryHtml = '';
  if (votes.length > 0) {
    voteSummaryHtml = '<div class="vote-summary">';
    if (approveVotes.length > 0) {
      voteSummaryHtml += '<span class="vote-chip approve">✅ ' + approveVotes.length + '人通过</span>';
    }
    if (rejectVotes.length > 0) {
      voteSummaryHtml += '<span class="vote-chip reject">❌ ' + rejectVotes.length + '人驳回</span>';
    }
    var totalVoters = votes.length;
    voteSummaryHtml += '<span class="vote-chip pending">🗳️ 共' + totalVoters + '人参与</span>';
    voteSummaryHtml += '</div>';
  }

  /* 投票详情列表 */
  var voteListHtml = '';
  if (votes.length > 0) {
    voteListHtml = '<div class="vote-list">';
    votes.forEach(function(v) {
      var isMe = user && v.userId === user.id;
      voteListHtml +=
        '<div class="vote-item">' +
          '<div class="vote-avatar">' + v.userAvatar + '</div>' +
          '<div class="vote-body">' +
            '<div class="vote-head">' +
              '<span class="vote-name">' + Utils.escapeHtml(v.userName) + '</span>' +
              (isMe ? '<span class="my-vote-tag">我</span>' : '') +
              '<span class="vote-badge ' + (v.decision === 'approved' ? 'approve' : 'reject') + '">' +
                (v.decision === 'approved' ? '通过' : '驳回') +
              '</span>' +
              '<span class="vote-time">' + Utils.formatTime(v.votedAt) + '</span>' +
            '</div>' +
            (v.comment
              ? '<div class="vote-comment">"' + Utils.escapeHtml(v.comment) + '"</div>'
              : '<div class="vote-no-comment">未填写意见</div>') +
            (v.imageUrl ? '<img src="' + v.imageUrl + '" class="vote-img-thumb" data-action="view-vote-image" data-url="' + v.imageUrl + '" alt="评审图片">' : '') +
          '</div>' +
        '</div>';
    });
    voteListHtml += '</div>';
  }

  if (options.showActions && user && req.applicantId !== user.id) {
    /* 飞书评审模式：所有人都能投票，不限状态 */
    footer = '<div class="approval-info">' + voteSummaryHtml + voteListHtml +
      '<div class="action-row">' +
        '<button class="btn btn-success" data-action="open-approve" data-id="' + req.id + '">' +
          (hasVoted && myVote.decision === 'approved' ? '✅ 已通过（改票）' : '✅ 通过') +
        '</button>' +
        '<button class="btn btn-danger" data-action="open-reject" data-id="' + req.id + '">' +
          (hasVoted && myVote.decision === 'rejected' ? '❌ 已驳回（改票）' : '❌ 驳回') +
        '</button>' +
      '</div></div>';
  } else if (options.showActions && user && req.applicantId === user.id) {
    /* 申请者自己：只看不能投 */
    footer = '<div class="approval-info">' + voteSummaryHtml + voteListHtml +
      '<div style="color:var(--text-tertiary);text-align:center;padding:8px 0">⏳ 等待朋友评审...</div></div>';
  } else {
    var favBtn = options.showFavorite && user
      ? '<button class="btn btn-ghost" data-action="toggle-favorite" data-id="' + req.id + '" style="margin-top:8px;width:100%;font-size:13px">' + (DB.isFavorited(req.id) ? '⭐ 已收藏' : '☆ 收藏') + '</button>'
      : '';
    footer = '<div class="approval-info">' + voteSummaryHtml + voteListHtml + favBtn +
      (req.status === 'approved' ? '<button class="btn btn-ghost" data-action="share-request" data-id="' + req.id + '" style="margin-top:8px;width:100%;font-size:13px">📤 分享安利</button>' : '') +
    '</div>';
  }

  var linkHtml = req.link ? '<a href="' + Utils.escapeHtml(req.link) + '" target="_blank" class="request-link">🔗 查看链接</a>' : '';
  var reqImageHtml = req.imageUrl ? '<img src="' + req.imageUrl + '" class="request-image" data-action="view-vote-image" data-url="' + req.imageUrl + '" alt="物品图片" style="width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:8px;cursor:pointer">' : '';
  var compactStyle = options.compact ? ' style="padding:12px"' : '';

  return '<div class="request-card"' + compactStyle + '>' +
    '<div class="request-header">' +
      '<div class="avatar">' + req.applicantAvatar + '</div>' +
      '<div class="user-info">' +
        '<div class="name">' + Utils.escapeHtml(req.applicantName) + '</div>' +
        '<div class="time">' + Utils.formatTime(req.createdAt) + '</div>' +
      '</div>' +
      statusBadge +
      (options.showDelete ? '<button class="req-delete-btn" data-action="delete-request" data-id="' + req.id + '">🗑️</button>' : '') +
    '</div>' +
    '<div class="request-item">' + Utils.escapeHtml(req.item) + '</div>' +
    '<div class="request-price">' + Utils.formatPrice(req.price) + '</div>' +
    linkHtml +
    reqImageHtml +
    '<div class="request-reason">' + Utils.escapeHtml(req.reason) + '</div>' +
    footer +
  '</div>';
}

/* ===== 主渲染 ===== */
function render() {
  var user = DB.getCurrentUser();

  if (!user) {
    renderLoginScreen();
    return;
  }

  var login = document.getElementById('login-screen');
  var app = document.getElementById('app');
  login.style.display = 'none';
  app.style.display = 'flex';

  renderHeader();
  renderTabBar();
  var content = document.getElementById('content');
  var html = '';
  switch (state.view) {
    case 'home':     html = renderHome();     break;
    case 'submit':   html = renderSubmit();   break;
    case 'approval': html = renderApproval(); break;
    case 'history':  html = renderHistory();  break;
    case 'mine':     html = renderMine();     break;
    case 'settings': html = renderSettings(); break;
    default:         html = renderHome();
  }
  content.innerHTML = html;
  content.scrollTop = 0;
}

/* ===== 事件处理 ===== */
function handleSubmitRequest() {
  var item = document.getElementById('form-item').value.trim();
  var price = document.getElementById('form-price').value.trim();
  var reason = document.getElementById('form-reason').value.trim();
  var link = document.getElementById('form-link').value.trim();

  if (!item) { showToast('请填写物品名称', 'error'); return; }
  if (!price || Number(price) <= 0) { showToast('请填写有效价格', 'error'); return; }
  if (!reason) { showToast('请填写购买理由', 'error'); return; }

  var imgIcon = document.querySelector('#req-img-area .img-uploading');
  if (imgIcon) { showToast('图片正在上传，请稍等', 'error'); return; }

  var req = DB.addRequest(item, price, reason, link, requestImageUrl);
  if (req) {
    requestImageUrl = null;
    requestImageRemoved = false;
    showToast('申请已提交，等待审批...', 'success');
    navigate('home');
  } else {
    showToast('提交失败，请重试', 'error');
  }
}

function handleConfirmAddMember() {
  var nameEl = document.getElementById('modal-member-name');
  var name = nameEl ? nameEl.value.trim() : '';
  if (!name) { showToast('请输入昵称', 'error'); return; }
  if (!state.modalRoles.isApplicant && !state.modalRoles.isApprover) {
    showToast('请至少选择一个角色', 'error'); return;
  }
  DB.addMember(name, state.modalSelectedEmoji, state.modalRoles.isApplicant, state.modalRoles.isApprover);
  showToast('已添加成员 ' + name, 'success');
  closeModal();
  render();
}

function handleRemoveMember(id) {
  var member = DB.getMember(id);
  if (member && member.isAdmin) { showToast('管理员不可删除', 'error'); return; }
  if (DB.getMembers().length <= 1) { showToast('至少保留一个成员', 'error'); return; }
  if (member && window.confirm('确定删除 ' + member.name + ' 吗？')) {
    DB.removeMember(id);
    showToast('已删除 ' + member.name, 'success');
    render();
  }
}

function handleDeleteRequest(requestId) {
  if (!DB.isCurrentUserAdmin()) { showToast('仅管理员可删除记录', 'error'); return; }
  var req = DB.data.requests.find(function(r) { return r.id === requestId; });
  if (req && window.confirm('确定删除这条记录吗？')) {
    DB.deleteRequest(requestId);
    showToast('记录已删除', 'success');
    render();
  }
}

function handleConfirmDecision() {
  if (!modalContext) return;
  var comment = document.getElementById('modal-comment').value.trim();
  var req = DB.data.requests.find(function(r) { return r.id === modalContext.requestId; });
  var wasChanging = req && req.votes && req.votes.some(function(v) { return v.userId === (DB.getCurrentUser() || {}).id; });
  var success = DB.voteRequest(modalContext.requestId, modalContext.action, comment);
  if (success) {
    var req2 = DB.data.requests.find(function(r) { return r.id === modalContext.requestId; });
    var actionLabel = modalContext.action === 'approved' ? '通过' : '驳回';
    var votes = (req2 && req2.votes) || [];
    var approveCount = votes.filter(function(v) { return v.decision === 'approved'; }).length;
    var rejectCount = votes.filter(function(v) { return v.decision === 'rejected'; }).length;

    var msg;
    if (wasChanging) {
      msg = '已修改你的投票为「' + actionLabel + '」 📝';
    } else {
      msg = '已提交投票：' + actionLabel + ' 🗳️';
    }

    /* 根据最新投票结果给出提示 */
    if (req2 && req2.status === 'approved') {
      msg = '投票结果：' + approveCount + '通过 ' + rejectCount + '驳回，申请已通过 🎉';
    } else if (req2 && req2.status === 'rejected') {
      msg = '投票结果：' + approveCount + '通过 ' + rejectCount + '驳回，申请已驳回';
    } else if (req2 && req2.status === 'pending') {
      msg += '\n当前 ' + approveCount + '通过 ' + rejectCount + '驳回，平票中，等待更多人投票';
    }

    showToast(msg, req2 && req2.status === 'approved' ? 'success' : 'info');
    closeModal();
    render();
  } else {
    showToast('操作失败', 'error');
  }
}

function handleResetData() {
  if (!DB.isCurrentUserAdmin()) { showToast('仅管理员可清空数据', 'error'); return; }
  showClearDataModal();
}

/* ===== 一键备份 ===== */
function handleBackupData() {
  if (!DB.isCurrentUserAdmin()) { showToast('仅管理员可备份数据', 'error'); return; }
  showToast('正在准备备份数据...', 'info');
  var now = new Date();
  var ts = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0') + '_' +
    String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0');

  var backup = {
    backupTime: now.toISOString(),
    backupDate: ts,
    version: 'v7.2',
    members: DB.data.members,
    requests: DB.data.requests,
    favorites: DB.data.favorites
  };

  var json = JSON.stringify(backup, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '购物审批备份_' + ts + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('备份文件已下载，请存到微信文件传输助手', 'success');
}

/* ===== 清空数据 PIN 验证弹窗 ===== */
function showClearDataModal() {
  if (!DB.isCurrentUserAdmin()) { showToast('仅管理员可清空数据', 'error'); return; }
  var overlay = document.getElementById('modal-overlay');
  overlay.innerHTML =
    '<div class="modal-sheet">' +
      '<div class="modal-header">' +
        '<h3>🗑 清空所有数据</h3>' +
        '<button class="modal-close" data-action="close-modal">✕</button>' +
      '</div>' +
      '<div style="padding:16px">' +
        '<div style="background:rgba(239,170,23,0.1);border:1px solid rgba(239,170,23,0.3);border-radius:8px;padding:12px;margin-bottom:16px">' +
          '<div style="font-size:13px;color:var(--warning);font-weight:600;margin-bottom:4px">⚠️ 警告</div>' +
          '<div style="font-size:13px;color:var(--text-secondary);line-height:1.6">此操作将清空所有购物申请记录和成员数据，仅保留管理员账号。此操作不可撤销！</div>' +
        '</div>' +
        '<div style="font-size:14px;margin-bottom:8px">请输入管理员PIN码以确认操作：</div>' +
        '<input type="password" id="clear-pin-input" maxlength="4" inputmode="numeric" placeholder="4位PIN码" style="width:100%;padding:12px;font-size:18px;text-align:center;letter-spacing:8px;border:1px solid var(--border);border-radius:8px;box-sizing:border-box" />' +
        '<button class="btn btn-danger" data-action="confirm-clear-data" style="width:100%;margin-top:12px">确认清空所有数据</button>' +
      '</div>' +
    '</div>';
  overlay.classList.add('active');
  setTimeout(function() { var inp = document.getElementById('clear-pin-input'); if (inp) inp.focus(); }, 100);
}

function handleConfirmClearData() {
  var user = DB.getCurrentUser();
  if (!user || !user.isAdmin) { showToast('仅管理员可清空数据', 'error'); return; }
  var pinInput = document.getElementById('clear-pin-input');
  var pin = pinInput ? pinInput.value.trim() : '';
  if (!pin || pin.length !== 4) { showToast('请输入4位PIN码', 'error'); return; }
  if (pin !== user.pin) { showToast('PIN码错误，操作取消', 'error'); return; }

  closeModal();
  DB.clearAllData();
  showToast('数据已清空', 'success');
  navigate('home');
}

/* ===== 导航 ===== */
function navigate(view) {
  closeModal();
  /* 离开申请页时重置图片状态 */
  if (state.view === 'submit' && view !== 'submit') {
    requestImageUrl = null;
    requestImageRemoved = false;
  }
  state.view = view;
  render();
}

/* ===== 事件委托 ===== */
document.addEventListener('click', function(e) {
  var target = e.target.closest('[data-action]');
  if (!target) return;
  var action = target.dataset.action;

  switch (action) {
    case 'navigate':
      navigate(target.dataset.view);
      break;
    case 'submit-request':
      handleSubmitRequest();
      break;
    case 'open-approve':
      showApprovalModal(target.dataset.id, 'approved');
      break;
    case 'open-reject':
      showApprovalModal(target.dataset.id, 'rejected');
      break;
    case 'confirm-decision':
      handleConfirmDecision();
      break;
    case 'select-vote-image':
      /* 点击上传区域或file input */
      if (target.tagName === 'INPUT') {
        if (target.files && target.files[0]) handleImageSelect(target);
      } else {
        var fileInput = target.querySelector('input[type="file"]');
        if (fileInput) fileInput.click();
      }
      break;
    case 'remove-vote-image':
      e.stopPropagation();
      resetImageUpload();
      break;
    case 'select-request-image':
      if (target.tagName === 'INPUT') {
        if (target.files && target.files[0]) handleRequestImageSelect(target);
      } else {
        var reqFileInput = target.querySelector('input[type="file"]');
        if (reqFileInput) reqFileInput.click();
      }
      break;
    case 'remove-request-image':
      e.stopPropagation();
      resetRequestImage();
      break;
    case 'view-vote-image':
      showImageLightbox(target.dataset.url);
      break;
    case 'close-modal':
      closeModal();
      break;
    case 'navigate-history':
      state.historyFilter = target.dataset.filter;
      navigate('history');
      break;
    case 'navigate-mine':
      state.mineFilter = target.dataset.filter;
      navigate('mine');
      break;
    case 'filter-history':
      state.historyFilter = target.dataset.filter;
      render();
      break;
    case 'navigate-settings':
      closeModal();
      navigate('settings');
      break;
    case 'open-add-member':
      showAddMemberModal();
      break;
    case 'select-modal-emoji':
      state.modalSelectedEmoji = target.dataset.emoji;
      var emojiEls = document.querySelectorAll('.emoji-option');
      for (var i = 0; i < emojiEls.length; i++) emojiEls[i].classList.remove('selected');
      target.classList.add('selected');
      break;
    case 'toggle-modal-role':
      var mr = target.dataset.role;
      state.modalRoles[mr] = !state.modalRoles[mr];
      if (!state.modalRoles.isApplicant && !state.modalRoles.isApprover) {
        state.modalRoles[mr] = true;
        showToast('至少保留一个角色', 'error');
        return;
      }
      if (state.modalRoles[mr]) {
        target.classList.add('on');
        if (mr === 'isApprover') target.classList.add('role-approver');
      } else {
        target.classList.remove('on');
        target.classList.remove('role-approver');
      }
      break;
    case 'confirm-add-member':
      handleConfirmAddMember();
      break;
    case 'toggle-member-role':
      var ok = DB.toggleMemberRole(target.dataset.id, target.dataset.role);
      if (!ok) showToast('至少保留一个角色', 'error');
      render();
      break;
    case 'remove-member':
      handleRemoveMember(target.dataset.id);
      break;
    case 'reset-data':
      showClearDataModal();
      break;
    case 'confirm-clear-data':
      handleConfirmClearData();
      break;
    case 'backup-data':
      handleBackupData();
      break;
    case 'delete-request':
      handleDeleteRequest(target.dataset.id);
      break;
    case 'share-request':
      showShareModal(target.dataset.id);
      break;
    case 'copy-share':
      handleCopyShare(target.dataset.text);
      break;
    case 'native-share':
      handleNativeShare(target.dataset.text);
      break;
    case 'toggle-favorite':
      var wasFav = DB.isFavorited(target.dataset.id);
      DB.toggleFavorite(target.dataset.id);
      showToast(wasFav ? '已取消收藏' : '已收藏', wasFav ? 'info' : 'success');
      render();
      break;
    /* --- 认证相关 --- */
    case 'do-login':
      handleLogin();
      break;
    case 'do-register':
      handleRegister();
      break;
    case 'switch-login-mode':
      state.loginMode = target.dataset.mode;
      render();
      break;
    case 'select-login-emoji':
      state.loginSelectedEmoji = target.dataset.emoji;
      var loginEmojiEls = document.querySelectorAll('.emoji-option');
      for (var j = 0; j < loginEmojiEls.length; j++) loginEmojiEls[j].classList.remove('selected');
      target.classList.add('selected');
      break;
    case 'logout':
      handleLogout();
      break;
    case 'open-change-pin':
      openChangePinModal();
      break;
    case 'confirm-change-pin':
      handleChangePin();
      break;
    case 'quick-select-user':
      state.currentUser = target.dataset.id;
      localStorage.setItem('fsp-user-id', target.dataset.id);
      closeModal();
      var swUser = DB.getMember(target.dataset.id);
      if (swUser) {
        NotificationSystem.requestPermission();
        NotificationSystem.updateTabTitle(DB.data.requests, swUser);
        showToast('已切换到 ' + swUser.name, 'success');
      }
      render();
      break;
    case 'set-mine-filter':
      state.mineFilter = target.dataset.filter;
      render();
      break;
  }
});

/* 点击遮罩关闭弹窗 */
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === e.currentTarget) closeModal();
});

/* 成员名称编辑 - 失焦保存 */
document.addEventListener('change', function(e) {
  /* 投票图片选择 */
  var imgInput = e.target.closest('input[type="file"][data-action="select-vote-image"]');
  if (imgInput) {
    if (imgInput.files && imgInput.files[0]) handleImageSelect(imgInput);
    return;
  }
  /* 申请图片选择 */
  var reqImgInput = e.target.closest('input[type="file"][data-action="select-request-image"]');
  if (reqImgInput) {
    if (reqImgInput.files && reqImgInput.files[0]) handleRequestImageSelect(reqImgInput);
    return;
  }
  var target = e.target.closest('[data-action="edit-member-name"]');
  if (!target) return;
  var name = target.value.trim();
  if (!name) {
    showToast('名称不能为空', 'error');
    var member = DB.getMember(target.dataset.id);
    if (member) target.value = member.name;
    return;
  }
  DB.updateMemberName(target.dataset.id, name);
  showToast('名称已更新', 'success');
});

/* 成员名称编辑 - 回车触发失焦 */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    var target = e.target.closest('[data-action="edit-member-name"]');
    if (target) { target.blur(); return; }
    /* 登录/注册回车提交 */
    var loginPin = e.target.closest('#login-pin');
    if (loginPin) { handleLogin(); return; }
    var regPinConfirm = e.target.closest('#reg-pin-confirm');
    if (regPinConfirm) { handleRegister(); return; }
    /* 清空数据PIN输入回车确认 */
    var clearPin = e.target.closest('#clear-pin-input');
    if (clearPin) { handleConfirmClearData(); return; }
  }
});

/* ===== 初始化 ===== */
DB.init();
</script>

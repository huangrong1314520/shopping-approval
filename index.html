/* ===== 导航 ===== */
function navigate(view) {
  closeModal();
  /* 离开申请页时重置图片状态 */
  if (state.view === 'submit' && view !== 'submit') {
    requestImageUrl = null;
    requestImageRemoved = false;
  }
  state.view = view;
  render();
}

/* ===== 事件委托 ===== */
document.addEventListener('click', function(e) {
  var target = e.target.closest('[data-action]');
  if (!target) return;
  var action = target.dataset.action;

  switch (action) {
    case 'navigate':
      navigate(target.dataset.view);
      break;
    case 'submit-request':
      handleSubmitRequest();
      break;
    case 'open-approve':
      showApprovalModal(target.dataset.id, 'approved');
      break;
    case 'open-reject':
      showApprovalModal(target.dataset.id, 'rejected');
      break;
    case 'confirm-decision':
      handleConfirmDecision();
      break;
    case 'capture-vote-image':
      { var ci = document.querySelector('input[type="file"][data-action="capture-vote-input"]'); if (ci) ci.click(); }
      break;
    case 'pick-vote-image':
      { var pi = document.querySelector('input[type="file"][data-action="pick-vote-input"]'); if (pi) pi.click(); }
      break;
    case 'remove-vote-image':
      e.stopPropagation();
      resetImageUpload();
      break;
    case 'capture-request-image':
      { var rci = document.querySelector('input[type="file"][data-action="capture-request-input"]'); if (rci) rci.click(); }
      break;
    case 'pick-request-image':
      { var rpi = document.querySelector('input[type="file"][data-action="pick-request-input"]'); if (rpi) rpi.click(); }
      break;
    case 'remove-request-image':
      e.stopPropagation();
      resetRequestImage();
      break;
    case 'view-vote-image':
      showImageLightbox(target.dataset.url);
      break;
    case 'copy-link':
      {
        var linkText = target.dataset.link || '';
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(linkText).then(function() {
            showToast('链接已复制，打开淘宝App即可打开', 'success');
          }).catch(function() {
            fallbackCopyText(linkText);
          });
        } else {
          fallbackCopyText(linkText);
        }
      }
      break;
    case 'close-modal':
      closeModal();
      break;
    case 'navigate-history':
      state.historyFilter = target.dataset.filter;
      navigate('history');
      break;
    case 'navigate-mine':
      state.mineFilter = target.dataset.filter;
      navigate('mine');
      break;
    case 'navigate-approval-unvoted':
      state.approvalFilter = 'unvoted';
      navigate('approval');
      break;
    case 'filter-history':
      state.historyFilter = target.dataset.filter;
      render();
      break;
    case 'toggle-rules':
      {
        var detail = document.getElementById('rules-detail');
        var arrow = document.getElementById('rules-arrow');
        if (detail) {
          var isOpen = detail.style.display !== 'none';
          detail.style.display = isOpen ? 'none' : 'block';
          if (arrow) arrow.textContent = isOpen ? '▼' : '▲';
        }
      }
      break;
    case 'filter-approval':
      state.approvalFilter = target.dataset.filter;
      render();
      break;
    case 'navigate-settings':
      closeModal();
      navigate('settings');
      break;
    case 'open-add-member':
      if (!DB.isCurrentUserAdmin()) { showToast('只有管理员可以添加成员', 'error'); return; }
      showAddMemberModal();
      break;
    case 'select-modal-emoji':
      state.modalSelectedEmoji = target.dataset.emoji;
      var emojiEls = document.querySelectorAll('.emoji-option');
      for (var i = 0; i < emojiEls.length; i++) emojiEls[i].classList.remove('selected');
      target.classList.add('selected');
      break;
    case 'toggle-modal-role':
      var mr = target.dataset.role;
      state.modalRoles[mr] = !state.modalRoles[mr];
      if (!state.modalRoles.isApplicant && !state.modalRoles.isApprover) {
        state.modalRoles[mr] = true;
        showToast('至少保留一个角色', 'error');
        return;
      }
      if (state.modalRoles[mr]) {
        target.classList.add('on');
        if (mr === 'isApprover') target.classList.add('role-approver');
      } else {
        target.classList.remove('on');
        target.classList.remove('role-approver');
      }
      break;
    case 'confirm-add-member':
      handleConfirmAddMember();
      break;
    case 'toggle-member-role':
      if (!DB.isCurrentUserAdmin()) { showToast('只有管理员可以调整角色', 'error'); return; }
      var ok = DB.toggleMemberRole(target.dataset.id, target.dataset.role);
      if (!ok) showToast('至少保留一个角色', 'error');
      render();
      break;
    case 'remove-member':
      handleRemoveMember(target.dataset.id);
      break;
    case 'reset-data':
      showClearDataModal();
      break;
    case 'confirm-clear-data':
      handleConfirmClearData();
      break;
    case 'backup-data':
      handleBackupData();
      break;
    case 'delete-request':
      handleDeleteRequest(target.dataset.id);
      break;
    case 'share-request':
      showShareModal(target.dataset.id);
      break;
    case 'copy-share':
      handleCopyShare(target.dataset.text);
      break;
    case 'native-share':
      handleNativeShare(target.dataset.text);
      break;
    case 'toggle-favorite':
      var wasFav = DB.isFavorited(target.dataset.id);
      DB.toggleFavorite(target.dataset.id);
      showToast(wasFav ? '已取消收藏' : '已收藏', wasFav ? 'info' : 'success');
      render();
      break;
    /* --- 认证相关 --- */
    case 'do-login':
      handleLogin();
      break;
    case 'do-register':
      handleRegister();
      break;
    case 'switch-login-mode':
      state.loginMode = target.dataset.mode;
      render();
      break;
    case 'select-login-emoji':
      state.loginSelectedEmoji = target.dataset.emoji;
      var loginEmojiEls = document.querySelectorAll('.emoji-option');
      for (var j = 0; j < loginEmojiEls.length; j++) loginEmojiEls[j].classList.remove('selected');
      target.classList.add('selected');
      break;
    case 'logout':
      handleLogout();
      break;
    case 'open-change-pin':
      openChangePinModal();
      break;
    case 'confirm-change-pin':
      handleChangePin();
      break;
    case 'set-mine-filter':
      state.mineFilter = target.dataset.filter;
      render();
      break;
  }
});

/* 点击遮罩关闭弹窗 */
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === e.currentTarget) closeModal();
});

/* 成员名称编辑 - 失焦保存 */
document.addEventListener('change', function(e) {
  /* 投票图片选择（拍照或相册） */
  var voteInput = e.target.closest('input[type="file"][data-action="capture-vote-input"], input[type="file"][data-action="pick-vote-input"]');
  if (voteInput) {
    if (voteInput.files && voteInput.files[0]) handleImageSelect(voteInput);
    voteInput.value = '';
    return;
  }
  /* 申请图片选择（拍照或相册） */
  var reqInput = e.target.closest('input[type="file"][data-action="capture-request-input"], input[type="file"][data-action="pick-request-input"]');
  if (reqInput) {
    if (reqInput.files && reqInput.files[0]) handleRequestImageSelect(reqInput);
    reqInput.value = '';
    return;
  }
  var target = e.target.closest('[data-action="edit-member-name"]');
  if (!target) return;
  if (!DB.isCurrentUserAdmin()) { showToast('只有管理员可以修改成员名称', 'error'); var curM = DB.getMember(target.dataset.id); if (curM) target.value = curM.name; return; }
  var name = target.value.trim();
  var memberId = target.dataset.id;
  if (!name) {
    showToast('名称不能为空', 'error');
    var member = DB.getMember(memberId);
    if (member) target.value = member.name;
    return;
  }
  /* 重名校验：排除自己 */
  var duplicate = DB.data.members.find(function(m) { return m.name === name && m.id !== memberId; });
  if (duplicate) {
    showToast('这个昵称已存在', 'error');
    var curMember = DB.getMember(memberId);
    if (curMember) target.value = curMember.name;
    return;
  }
  DB.updateMemberName(memberId, name);
  showToast('名称已更新', 'success');
});

/* 成员名称编辑 - 回车触发失焦 */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    var target = e.target.closest('[data-action="edit-member-name"]');
    if (target) { target.blur(); return; }
    /* 登录/注册回车提交 */
    var loginName = e.target.closest('#login-name');
    if (loginName) { document.getElementById('login-pin').focus(); return; }
    var loginPin = e.target.closest('#login-pin');
    if (loginPin) { handleLogin(); return; }
    var regPinConfirm = e.target.closest('#reg-pin-confirm');
    if (regPinConfirm) { handleRegister(); return; }
    /* 清空数据PIN输入回车确认 */
    var clearPin = e.target.closest('#clear-pin-input');
    if (clearPin) { handleConfirmClearData(); return; }
  }
});

/* ===== 初始化 ===== */
DB.init();
</script>

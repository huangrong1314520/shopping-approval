<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0d1a">
<meta name="description" content="朋友间共用的购物审批小工具">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>朋友购物审批站</title>
<style>
/* ===== Reset & Variables ===== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0d0d1a;
  --bg-card: #1a1a2e;
  --bg-input: #16162a;
  --border: #2a2a3e;
  --border-light: #33334a;
  --primary: #7c3aed;
  --primary-light: #a78bfa;
  --secondary: #ec4899;
  --success: #22c55e;
  --success-bg: rgba(34, 197, 94, 0.15);
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.15);
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.15);
  --text: #f1f1f3;
  --text-secondary: #9ca3af;
  --text-tertiary: #6b7280;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
  --gradient: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
  --gradient-success: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
  --gradient-danger: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
  --max-width: 480px;
  --tabbar-h: 64px;
  --header-h: 56px;
}

html, body { height: 100%; }
body { overflow: hidden; }
/* iOS Safari 允许登录页滑动 */
.login-screen { overflow-y: auto; -webkit-overflow-scrolling: touch; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

#app {
  max-width: var(--max-width);
  margin: 0 auto;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ===== Header ===== */
.app-header {
  height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
}
.app-header h1 {
  font-size: 18px;
  font-weight: 700;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.user-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.user-badge:active { transform: scale(0.95); }
.user-badge .avatar { font-size: 18px; }

/* ===== Content ===== */
.app-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px;
  padding-bottom: calc(var(--tabbar-h) + 16px);
  -webkit-overflow-scrolling: touch;
}
.app-content::-webkit-scrollbar { width: 0; }

/* ===== Tab Bar ===== */
.tab-bar {
  height: var(--tabbar-h);
  display: flex;
  align-items: center;
  justify-content: space-around;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 6px;
  cursor: pointer;
  transition: all 0.2s;
  background: none;
  border: none;
  color: var(--text-tertiary);
  font-size: 10px;
  font-family: inherit;
  position: relative;
}
.tab-item .tab-icon { font-size: 20px; line-height: 1; }
.tab-item.active { color: var(--primary-light); }
.tab-item.active .tab-icon { transform: scale(1.15); }
.tab-badge {
  position: absolute;
  top: 2px;
  right: 6px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== Cards ===== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}

/* ===== Stats Grid ===== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 6px;
  text-align: center;
}
.stat-card .stat-icon { font-size: 18px; margin-bottom: 4px; }
.stat-card .stat-value { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
.stat-card .stat-label { font-size: 11px; color: var(--text-secondary); }

/* ===== Section Title ===== */
.section-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin: 20px 0 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
  width: 100%;
  font-family: inherit;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--gradient); color: #fff; }
.btn-success { background: var(--gradient-success); color: #fff; }
.btn-danger { background: var(--gradient-danger); color: #fff; }
.btn-ghost { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }

/* ===== Forms ===== */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 6px;
  font-weight: 500;
}
.form-input, .form-textarea, .form-select {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  transition: border-color 0.2s;
}
.form-input:focus, .form-textarea:focus, .form-select:focus { outline: none; border-color: var(--primary); }
.form-textarea { resize: none; min-height: 80px; }
.form-input::placeholder, .form-textarea::placeholder { color: var(--text-tertiary); }
.form-select { -webkit-appearance: none; appearance: none; }

.price-input-wrapper { position: relative; }
.price-input-wrapper .price-prefix {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-secondary);
  font-size: 14px;
  pointer-events: none;
}
.price-input-wrapper .form-input { padding-left: 28px; }

/* ===== Request Card ===== */
.request-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  animation: fadeInUp 0.3s ease;
}
.request-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.request-header .avatar {
  font-size: 28px;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-input);
  border-radius: 50%;
  flex-shrink: 0;
}
.request-header .user-info { flex: 1; }
.request-header .user-info .name { font-size: 14px; font-weight: 600; }
.request-header .user-info .time { font-size: 12px; color: var(--text-tertiary); }
.request-item { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.request-price { font-size: 20px; font-weight: 700; color: var(--secondary); margin-bottom: 8px; }
.request-reason { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; line-height: 1.5; }
.request-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--primary-light);
  text-decoration: none;
  margin-bottom: 8px;
}
.request-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

/* ===== Status Badge ===== */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}
.status-pending { background: var(--warning-bg); color: var(--warning); }
.status-approved { background: var(--success-bg); color: var(--success); }
.status-rejected { background: var(--danger-bg); color: var(--danger); }

/* ===== Action Row ===== */
.action-row { display: flex; gap: 10px; }
.action-row .btn { flex: 1; padding: 10px; font-size: 13px; }

/* ===== Approval Info ===== */
.approval-info {
  background: var(--bg-input);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  margin-top: 12px;
  font-size: 12px;
  color: var(--text-secondary);
}
.approval-info .approver {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}
.approval-info .comment { color: var(--text); font-style: italic; }

/* ===== 多人评审制 - 投票统计与列表 ===== */
.vote-summary {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  margin-bottom: 8px;
}
.vote-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
}
.vote-chip.approve { background: rgba(16,185,129,0.15); color: #34d399; }
.vote-chip.reject { background: rgba(239,68,68,0.15); color: #f87171; }
.vote-chip.pending { background: rgba(245,158,11,0.15); color: #fbbf24; }

.vote-list {
  margin-top: 8px;
  border-top: 1px solid var(--border);
  padding-top: 8px;
}
.vote-item {
  display: flex;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border-light);
}
.vote-item:last-child { border-bottom: none; }
.vote-item .vote-avatar { font-size: 20px; flex-shrink: 0; }
.vote-item .vote-body { flex: 1; min-width: 0; }
.vote-item .vote-head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 2px;
}
.vote-item .vote-name { font-weight: 600; font-size: 13px; }
.vote-item .vote-badge {
  font-size: 11px;
  padding: 1px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.vote-item .vote-badge.approve { background: rgba(16,185,129,0.15); color: #34d399; }
.vote-item .vote-badge.reject { background: rgba(239,68,68,0.15); color: #f87171; }
.vote-item .vote-time { font-size: 11px; color: var(--text-tertiary); margin-left: auto; }
.vote-item .vote-comment {
  font-size: 13px;
  color: var(--text);
  font-style: italic;
  margin-top: 2px;
}
.vote-item .vote-no-comment { font-size: 12px; color: var(--text-tertiary); }
.my-vote-tag {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  background: var(--gradient);
  color: #fff;
  margin-left: 4px;
  font-weight: 600;
}

/* ===== Filter Tabs ===== */
.filter-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-tabs::-webkit-scrollbar { display: none; }
.filter-tab {
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
}
.filter-tab.active { background: var(--gradient); color: #fff; border-color: transparent; }
.filter-count {
  display: inline-block;
  margin-left: 4px;
  padding: 1px 6px;
  font-size: 11px;
  border-radius: 10px;
  background: rgba(0,0,0,0.06);
}
.filter-tab.active .filter-count { background: rgba(255,255,255,0.25); color: #fff; }

/* ===== Empty State ===== */
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-tertiary);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.empty-state .empty-text { font-size: 14px; line-height: 1.6; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
.modal-sheet {
  width: 100%;
  max-width: var(--max-width);
  background: var(--bg-card);
  border-radius: 24px 24px 0 0;
  padding: 20px 16px 40px;
  animation: slideUp 0.3s ease;
  max-height: 80vh;
  overflow-y: auto;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.modal-header h3 { font-size: 17px; font-weight: 700; }
.modal-close {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--bg-input);
  border: none;
  color: var(--text-secondary);
  font-size: 16px;
  cursor: pointer;
}

/* ===== Toast ===== */
.toast-container {
  position: fixed;
  top: 64px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
  width: max-content;
  max-width: 90vw;
}
.toast {
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.2s forwards;
  white-space: nowrap;
}
.toast-success { background: var(--success-bg); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.3); }
.toast-error { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
.toast-warning { background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
.toast-info { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }

/* ===== Member Selector ===== */
.member-selector {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 4px 0 8px;
  scrollbar-width: none;
}
.member-selector::-webkit-scrollbar { display: none; }
.member-chip {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  border: 2px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
  min-width: 64px;
}
.member-chip.active { border-color: var(--primary); background: rgba(124, 58, 237, 0.1); }
.member-chip .chip-avatar { font-size: 28px; }
.member-chip .chip-name { font-size: 12px; color: var(--text-secondary); }
.member-chip.active .chip-name { color: var(--text); }

/* ===== Emoji Picker ===== */
.emoji-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 4px;
  margin: 8px 0;
}
.emoji-option {
  font-size: 22px;
  padding: 6px;
  border-radius: var(--radius-xs);
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  border: 2px solid transparent;
}
.emoji-option:hover { background: var(--bg-input); }
.emoji-option.selected { border-color: var(--primary); background: rgba(124, 58, 237, 0.1); }

/* ===== Role Toggle ===== */
.role-toggle { display: flex; gap: 8px; }
.role-option {
  flex: 1;
  padding: 10px;
  text-align: center;
  border-radius: var(--radius-sm);
  background: var(--bg-input);
  border: 1px solid var(--border);
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  transition: all 0.2s;
}
.role-option.active { background: rgba(124, 58, 237, 0.15); border-color: var(--primary); color: var(--primary-light); }

/* ===== Member Card ===== */
.member-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
}
.member-card .mc-avatar {
  font-size: 28px;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-card);
  border-radius: 50%;
  flex-shrink: 0;
}
.member-card .mc-info { flex: 1; }
.member-card .mc-name { font-size: 14px; font-weight: 600; }
.member-card .mc-roles { display: flex; gap: 4px; margin-top: 2px; }
.member-card .mc-remove {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--danger-bg);
  border: none;
  color: var(--danger);
  font-size: 14px;
  cursor: pointer;
  flex-shrink: 0;
}

/* ===== Greeting ===== */
.greeting { margin-bottom: 20px; }
.greeting .greeting-text { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.greeting .greeting-sub { font-size: 13px; color: var(--text-secondary); }

.role-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
  margin-left: 8px;
  vertical-align: middle;
}
.role-badge.applicant { background: rgba(124, 58, 237, 0.15); color: var(--primary-light); }
.role-badge.approver { background: rgba(236, 72, 153, 0.15); color: var(--secondary); }
.role-badge.admin { background: rgba(245, 158, 11, 0.15); color: var(--warning); }

/* ===== Activity Item ===== */
.activity-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.activity-item:last-child { border-bottom: none; }
.activity-item .ai-avatar {
  font-size: 24px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-input);
  border-radius: 50%;
  flex-shrink: 0;
}
.activity-item .ai-content { flex: 1; font-size: 13px; }
.activity-item .ai-text { color: var(--text); line-height: 1.4; }
.activity-item .ai-text strong { font-weight: 600; }
.activity-item .ai-meta { color: var(--text-tertiary); font-size: 12px; margin-top: 2px; }

/* ===== Quick Action ===== */
.quick-action { margin-bottom: 20px; }

/* ===== Toggle Switch ===== */
.mc-toggles { display: flex; gap: 16px; margin-top: 6px; flex-wrap: wrap; }
.mc-toggle-group { display: flex; align-items: center; gap: 6px; }
.mc-toggle-label { font-size: 12px; color: var(--text-secondary); }
.toggle-switch {
  position: relative;
  width: 40px;
  height: 22px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}
.toggle-switch .toggle-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  background: var(--text-tertiary);
  border-radius: 50%;
  transition: all 0.2s;
}
.toggle-switch.on { background: rgba(124, 58, 237, 0.3); border-color: var(--primary); }
.toggle-switch.on .toggle-thumb { left: 20px; background: var(--primary-light); }
.toggle-switch.on.role-approver { background: rgba(236, 72, 153, 0.3); border-color: var(--secondary); }
.toggle-switch.on.role-approver .toggle-thumb { background: var(--secondary); }

/* ===== Quick Switch List ===== */
.quick-switch-list { display: flex; flex-direction: column; gap: 8px; }
.quick-switch-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--bg-input);
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
}
.quick-switch-item:active { transform: scale(0.98); }
.quick-switch-item.active { border-color: var(--primary); background: rgba(124, 58, 237, 0.08); }
.quick-switch-item .qs-avatar {
  font-size: 28px; width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-card); border-radius: 50%; flex-shrink: 0;
}
.quick-switch-item .qs-info { flex: 1; }
.quick-switch-item .qs-name { font-size: 14px; font-weight: 600; }

<script>
/* ============================================================
 * 朋友购物审批站 - Supabase 实时同步版
 * 数据存储在 Supabase PostgreSQL，通过 Realtime 实时同步
 * ============================================================ */

/* ===== 配置 ===== */
var AVATAR_EMOJIS = ['🐱','🐶','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🦄','🐴','🐲','🦕','🦖','🐙','🦋','🐳','🐬','🦈','🦒','🐘','🦏','🦓','🦔','🐰','🐹','🐭','🐢','🦉','🦅','🦜','🦢','🦩','🐣','🐥','🐝','😀','😎','🤓','🥳','🤪','😜','🤠','👻','🤡','👽','🤖','🎃','😈','👼','🦸','🦹','🥷','🧙','🧚','🧛','🧜','🧝'];

var TABS = [
  { id: 'home',     label: '首页', icon: '🏠' },
  { id: 'submit',   label: '申请', icon: '📝' },
  { id: 'approval',  label: '审批', icon: '✅' },
  { id: 'history',  label: '记录', icon: '📋' },
  { id: 'mine',     label: '我的', icon: '👤' },
  { id: 'settings', label: '设置', icon: '⚙️' }
];

var TAB_LABELS = { home: '朋友购物审批站', submit: '发起申请', approval: '审批队列', history: '消费记录', mine: '我的记录', settings: '设置' };

/* ===== 状态 ===== */
var state = {
  view: 'home',
  currentUser: null,
  historyFilter: 'all',
  approvalFilter: 'unvoted',
  selectedEmoji: '🐱',
  newMemberRole: { isApplicant: true, isApprover: false },
  modalSelectedEmoji: '🐱',
  modalRoles: { isApplicant: true, isApprover: false },
  loginMode: 'login',
  loginSelectedEmoji: '🐱',
  serverConnected: false,
  mineFilter: 'all'
};

/* ===== 通知系统：标签提醒 + 声音提醒 + 弹窗 ===== */
var NotificationSystem = {
  soundEnabled: true,
  originalTitle: '朋友购物审批站',
  lastNotifyTime: 0,

  /* 播放提示音（Web Audio API，无需外部文件） */
  playSound: function() {
    if (!this.soundEnabled) return;
    try {
      var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      /* 两个音节"叮咚" */
      var notes = [
        { freq: 880, delay: 0, duration: 0.15 },
        { freq: 660, delay: 0.12, duration: 0.2 }
      ];
      notes.forEach(function(note) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = note.freq;
        osc.type = 'sine';
        var startTime = audioCtx.currentTime + note.delay;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.3, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + note.duration);
        osc.start(startTime);
        osc.stop(startTime + note.duration);
      });
    } catch (e) { /* 静默失败 */ }
  },

  /* 发送通知：声音 + Toast + 浏览器通知 */
  notify: function(type, title, message) {
    var now = Date.now();
    /* 防抖：3秒内不重复通知 */
    if (now - this.lastNotifyTime < 3000) return;
    this.lastNotifyTime = now;

    /* 播放声音 */
    this.playSound();

    /* 显示Toast */
    showToast(title + '\n' + message, type === 'new_request' ? 'success' : 'info');

    /* 浏览器原生通知（需要授权） */
    if ('Notification' in window && Notification.permission === 'granted') {
      try {
        var n = new Notification(title, {
          body: message,
          icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🛒</text></svg>',
          tag: type
        });
        n.onclick = function() { window.focus(); n.close(); };
      } catch (e) { /* 静默失败 */ }
    }
  },

  /* 更新标签标题：显示待评审数量 */
  updateTabTitle: function(requests, user) {
    if (!user) {
      document.title = this.originalTitle;
      return;
    }
    var pendingCount = requests.filter(function(r) {
      return r.applicantId !== user.id && r.status === 'pending';
    }).length;

    /* 自己申请被投票但还没通过的也算 */
    var myVotedRequests = requests.filter(function(r) {
      if (r.applicantId !== user.id) return false;
      var votes = r.votes || [];
      return votes.length > 0 && r.status === 'pending';
    }).length;

    var totalBadge = pendingCount + myVotedRequests;
    if (totalBadge > 0) {
      document.title = '(' + totalBadge + ') ' + this.originalTitle;
    } else {
      document.title = this.originalTitle;
    }
  },

  /* 请求浏览器通知权限 */
  requestPermission: function() {
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  }
};

/* ===== Supabase 配置 ===== */
var SUPABASE_URL = 'https://klynsbdhtrpmfknzufvc.supabase.co';
var SUPABASE_KEY = 'sb_publishable_yi8_gBrWGVY-VBSHC-3vuw_eboErvDl';
var sb = null;

/* ===== 数据映射（snake_case → camelCase） ===== */
function mapMember(m) {
  if (!m) return null;
  return { id: m.id, name: m.name, avatar: m.avatar,
    isApplicant: m.is_applicant, isApprover: m.is_approver, isAdmin: m.is_admin, pin: m.pin };
}
function mapRequest(r) {
  if (!r) return null;
  return { id: r.id,
    applicantId: r.applicant_id, applicantName: r.applicant_name, applicantAvatar: r.applicant_avatar,
    item: r.item, price: Number(r.price), reason: r.reason, link: r.link || '',
    imageUrl: r.image_url || '',
    status: r.status, votes: r.votes || [],
    approverId: r.approver_id, approverName: r.approver_name, approverAvatar: r.approver_avatar,
    comment: r.comment,
    version: r.version || 0,
    createdAt: r.created_at ? new Date(r.created_at).getTime() : Date.now(),
    decidedAt: r.decided_at ? new Date(r.decided_at).getTime() : null };
}
function mapFavorite(f) {
  if (!f) return null;
  return { id: f.id, userId: f.user_id, requestId: f.request_id,
    createdAt: f.created_at ? new Date(f.created_at).getTime() : Date.now() };
}

/* ===== 数据层（Supabase） ===== */
var DB = {
  data: { members: [], requests: [], favorites: [] },

  init: function() {
    state.currentUser = localStorage.getItem('fsp-user-id');
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    this.loadAll();
    this.subscribe();
  },

  loadAll: function() {
    var self = this;
    Promise.all([
      sb.from('members').select('*'),
      sb.from('requests').select('*').order('created_at', { ascending: false })
    ]).then(function(results) {
      self.data.members = (results[0].data || []).map(mapMember);
      self.data.requests = (results[1].data || []).map(mapRequest);
      /* 首次加载也需校正旧数据状态 + 48小时到期检测 */
      self.recalibrateStatuses(self.data.requests);
      state.serverConnected = true;
      if (state.currentUser && !self.getMember(state.currentUser)) {
        state.currentUser = null;
        localStorage.removeItem('fsp-user-id');
      }
      /* 首次加载更新标签标题 */
      var curUser = state.currentUser ? self.getMember(state.currentUser) : null;
      NotificationSystem.updateTabTitle(self.data.requests, curUser);
      /* 单独加载收藏（表可能还没建，不阻塞主流程） */
      sb.from('favorites').select('*').order('created_at', { ascending: false }).then(function(result) {
        self.data.favorites = (result.data || []).map(mapFavorite);
        render();
      }).catch(function() {
        self.data.favorites = [];
        render();
      });
      render();
    }).catch(function(err) {
      state.serverConnected = false;
      render();
    });
  },

  subscribe: function() {
    var self = this;
    var membersCh = sb.channel('members-ch');
    membersCh.on('postgres_changes', { event: '*', schema: 'public', table: 'members' }, function() {
      self.refreshMembers();
    });
    membersCh.subscribe(function(status) {
      if (status === 'CHANNEL_CLOSED' || status === 'TIMED_OUT' || status === 'CHANNEL_ERROR') {
        setTimeout(function() { self.subscribe(); }, 3000);
      }
    });

    var requestsCh = sb.channel('requests-ch');
    requestsCh.on('postgres_changes', { event: '*', schema: 'public', table: 'requests' }, function() {
      self.refreshRequests(true);
    });
    requestsCh.subscribe(function(status) {
      if (status === 'CHANNEL_CLOSED' || status === 'TIMED_OUT' || status === 'CHANNEL_ERROR') {
        setTimeout(function() { self.subscribe(); }, 3000);
      }
    });

    var favCh = sb.channel('favorites-ch');
    favCh.on('postgres_changes', { event: '*', schema: 'public', table: 'favorites' }, function() {
      self.refreshFavorites();
    });
    favCh.subscribe(function(status) {
      if (status === 'CHANNEL_CLOSED' || status === 'TIMED_OUT' || status === 'CHANNEL_ERROR') {
        setTimeout(function() { self.subscribe(); }, 3000);
      }
    });
  },

  refreshMembers: function() {
    var self = this;
    sb.from('members').select('*').then(function(result) {
      self.data.members = (result.data || []).map(mapMember);
      if (state.currentUser && !self.getMember(state.currentUser)) {
        state.currentUser = null;
        localStorage.removeItem('fsp-user-id');
      }
      render();
    });
  },

  refreshRequests: function(isRealtime) {
    var self = this;
    /* 记录旧数据用于检测变化 */
    var oldRequests = self.data.requests;
    var oldRequestIds = oldRequests.map(function(r) { return r.id; });
    var oldVoteCounts = {};
    oldRequests.forEach(function(r) {
      var votes = r.votes || [];
      oldVoteCounts[r.id] = votes.length;
    });

    sb.from('requests').select('*').order('created_at', { ascending: false }).then(function(result) {
      self.data.requests = (result.data || []).map(mapRequest);
      var newRequests = self.data.requests;

      /* 自动校正旧数据状态（从"一人通过即生效"迁移到"多数决"） */
      self.recalibrateStatuses(newRequests);

      /* 实时推送时检测新申请和新投票 */
      if (isRealtime && state.currentUser) {
        var user = state.currentUser;

        /* 检测新申请（不是自己发起的） */
        var newForMe = newRequests.filter(function(r) {
          return r.applicantId !== user.id && oldRequestIds.indexOf(r.id) < 0;
        });
        if (newForMe.length > 0) {
          var names = newForMe.map(function(r) { return r.applicantName; }).join('、');
          NotificationSystem.notify('new_request', newForMe.length + '条新申请待评审', names + ' 提交了新申请');
        }

        /* 检测自己的申请有新投票 */
        newRequests.forEach(function(r) {
          if (r.applicantId === user.id) {
            var newVoteCount = (r.votes || []).length;
            var oldCount = oldVoteCounts[r.id] || 0;
            if (newVoteCount > oldCount) {
              var latestVote = (r.votes || [])[newVoteCount - 1];
              if (latestVote && latestVote.userId !== user.id) {
                var decision = latestVote.decision === 'approved' ? '✅通过' : '❌驳回';
                NotificationSystem.notify('new_vote', latestVote.userName + ' ' + decision + '了你的申请',
                  '"' + r.item + '" — ' + (latestVote.comment || '未填写意见'));
              }
            }
          }
        });
      }

      /* 更新标签标题 */
      NotificationSystem.updateTabTitle(newRequests, state.currentUser);

      render();
    });
  },

  /* 自动校正：1.旧数据状态 2.48小时到期自动截止 */
  recalibrateStatuses: function(requests) {
    var toFix = [];
    var now = Date.now();
    var DEADLINE = 48 * 60 * 60 * 1000; /* 48小时 */

    requests.forEach(function(req) {
      var votes = req.votes || [];
      var approveCount = votes.filter(function(v) { return v.decision === 'approved'; }).length;
      var rejectCount = votes.filter(function(v) { return v.decision === 'rejected'; }).length;
      var deadline = req.createdAt + DEADLINE;
      var isExpired = now > deadline;

      /* 按多数决计算正确状态 */
      var correctStatus;
      if (approveCount > rejectCount) correctStatus = 'approved';
      else if (rejectCount > approveCount) correctStatus = 'rejected';
      else correctStatus = 'pending';

      /* 48小时到期 + 仍待审批 → 强制截止，默认驳回（含0票情况） */
      if (isExpired && correctStatus === 'pending') {
        correctStatus = 'rejected';
      }

      if (req.status !== correctStatus) {
        req.status = correctStatus;
        if (correctStatus === 'pending') {
          req.decidedAt = null;
          req.approverId = null;
          req.approverName = null;
          req.approverAvatar = null;
          req.comment = null;
        } else {
          /* 如果是到期自动驳回，decidedAt 用截止时间而不是当前时间 */
          if (isExpired && correctStatus === 'rejected') {
            req.decidedAt = deadline;
          } else if (!req.decidedAt) {
            req.decidedAt = Date.now();
          }
        }
        toFix.push({
          id: req.id,
          status: correctStatus,
          decidedAt: correctStatus === 'pending' ? null : new Date(req.decidedAt).toISOString(),
          clearApprover: correctStatus === 'pending'
        });
      }
    });

    /* 批量更新到数据库 */
    toFix.forEach(function(fix) {
      var updateData = { status: fix.status, decided_at: fix.decidedAt };
      if (fix.clearApprover) {
        updateData.approver_id = null;
        updateData.approver_name = null;
        updateData.approver_avatar = null;
        updateData.comment = null;
      }
      sb.from('requests').update(updateData).eq('id', fix.id).then(function(result) {
        if (result && result.error) console.log('校正失败:', result.error);
      }).catch(function(e) { console.log('校正异常:', e); });
    });
  },

  /* 从服务器刷新单条请求（用于冲突重试），返回 Promise */
  refreshRequestSingle: function(requestId) {
    var self = this;
    return sb.from('requests').select('*').eq('id', requestId).then(function(result) {
      if (result.error) return null;
      var data = result.data || [];
      if (data.length === 0) return null;
      var updated = mapRequest(data[0]);
      var idx = self.data.requests.findIndex(function(r) { return r.id === requestId; });
      if (idx >= 0) self.data.requests[idx] = updated;
      return updated;
    });
  },

  refreshFavorites: function() {
    var self = this;
    sb.from('favorites').select('*').order('created_at', { ascending: false }).then(function(result) {
      self.data.favorites = (result.data || []).map(mapFavorite);
      render();
    }).catch(function() {
      self.data.favorites = [];
    });
  },

  getMembers: function() { return this.data.members; },
  getMember: function(id) { return this.data.members.find(function(m) { return m.id === id; }); },
  getCurrentUser: function() { return this.getMember(state.currentUser); },

  getPendingRequests: function() {
    return this.data.requests.filter(function(r) { return r.status === 'pending'; });
  },
  getFilteredRequests: function(filter) {
    if (filter === 'all') return this.data.requests;
    return this.data.requests.filter(function(r) { return r.status === filter; });
  },
  getRecentActivity: function(limit) {
    return this.data.requests.slice().sort(function(a, b) {
      var aT = a.decidedAt || a.createdAt;
      var bT = b.decidedAt || b.createdAt;
      return bT - aT;
    }).slice(0, limit || 5);
  },
  getStats: function() {
    var all = this.data.requests;
    var pending = all.filter(function(r) { return r.status === 'pending'; });
    var approved = all.filter(function(r) { return r.status === 'approved'; });
    var rejected = all.filter(function(r) { return r.status === 'rejected'; });
    var totalSpent = approved.reduce(function(sum, r) { return sum + r.price; }, 0);
    var monthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime();
    var monthSpent = approved.filter(function(r) { return (r.decidedAt || 0) >= monthStart; })
      .reduce(function(sum, r) { return sum + r.price; }, 0);
    return {
      pending: pending.length,
      approved: approved.length,
      rejected: rejected.length,
      totalSpent: totalSpent,
      monthSpent: monthSpent,
      approvalRate: (approved.length + rejected.length) > 0
        ? Math.round(approved.length / (approved.length + rejected.length) * 100) : 0
    };
  },
  isCurrentUserAdmin: function() {
    var user = this.getCurrentUser();
    return !!(user && user.isAdmin);
  },

  getMyStats: function() {

    var all = this.data.requests;
    var myApplied = all.filter(function(r) { return r.applicantId === user.id; });

  /* --- 写操作：直接 Supabase 查询 --- */
  /* 发起申请：等待服务器确认，返回 Promise<{success, id}> */
  addRequest: function(item, price, reason, link, imageUrl) {
    var self = this;
    var user = this.getCurrentUser();
    if (!user) return Promise.resolve({ success: false });
    var id = 'r' + Date.now();
    var newReq = {
      id: id,
      applicantId: user.id, applicantName: user.name, applicantAvatar: user.avatar,
      item: item, price: Number(price), reason: reason, link: link || '',
      imageUrl: imageUrl || '',
      status: 'pending', votes: [], version: 1,
      createdAt: Date.now(), decidedAt: null,
      approverId: null, approverName: null, approverAvatar: null, comment: null
    };
    /* 乐观插入本地列表 */
    self.data.requests.unshift(newReq);
    render();

    return sb.from('requests').insert({
      id: id,
      applicant_id: user.id, applicant_name: user.name, applicant_avatar: user.avatar,
      item: item, price: price, reason: reason, link: link || '',
      image_url: imageUrl || '',
      status: 'pending', votes: [], version: 1
    }).select().then(function(result) {
      if (result.error) {
        /* version 列不存在（旧数据未迁移），降级为不带 version 的插入 */
        if (result.error.code === '42703' || (result.error.message && result.error.message.indexOf('version') >= 0)) {
          return sb.from('requests').insert({
            id: id,
            applicant_id: user.id, applicant_name: user.name, applicant_avatar: user.avatar,
            item: item, price: price, reason: reason, link: link || '',
            image_url: imageUrl || '',
            status: 'pending', votes: []
          }).select().then(function(r2) {
            if (r2.error) {
              var idx = self.data.requests.findIndex(function(r) { return r.id === id; });
              if (idx >= 0) self.data.requests.splice(idx, 1);
              showToast(r2.error.message, 'error');
              render();
              return { success: false };
            }
            return { success: true, id: id };
          });
        }
        /* 其他错误，回滚 */
        var idx = self.data.requests.findIndex(function(r) { return r.id === id; });
        if (idx >= 0) self.data.requests.splice(idx, 1);
        showToast(result.error.message, 'error');
        render();
        return { success: false };
      }
      return { success: true, id: id };
    }).catch(function() {
      /* 网络错误也回滚 */
      var idx = self.data.requests.findIndex(function(r) { return r.id === id; });
      if (idx >= 0) self.data.requests.splice(idx, 1);
      showToast('网络错误，提交失败，请重试', 'error');
      render();
      return { success: false };
    });
  },

  /* 投票：乐观锁 + 冲突重试，返回 Promise<{success, status, votes}> */
  voteRequest: function(requestId, decision, comment, savedImageUrl) {
    var self = this;
    var user = this.getCurrentUser();
    if (!user) return Promise.resolve({ success: false });
    if (!user.isApprover) { showToast('你不是审批人，无法投票', 'error'); return Promise.resolve({ success: false }); }

    var MAX_RETRIES = 3;

    function attempt(retryCount) {
      var req = self.data.requests.find(function(r) { return r.id === requestId; });
      if (!req) return Promise.resolve({ success: false });
      if (req.applicantId === user.id) { showToast('不能审批自己的申请', 'error'); return Promise.resolve({ success: false }); }

      /* 48小时投票截止检查 */
      var deadline = req.createdAt + 48 * 60 * 60 * 1000;
      if (Date.now() > deadline) {
        showToast('该申请投票已截止（超过48小时），无法再投票', 'error');
        return Promise.resolve({ success: false });
      }

      var currentVersion = req.version || 0;

      /* 计算新的投票列表 */
      var votes = req.votes ? req.votes.slice() : [];
      var existingIdx = -1;
      for (var i = 0; i < votes.length; i++) {
        if (votes[i].userId === user.id) { existingIdx = i; break; }
      }
      var newVote = {
        userId: user.id, userName: user.name, userAvatar: user.avatar,
        decision: decision, comment: comment || '', votedAt: Date.now(),
        imageUrl: savedImageUrl || voteImageUrl || null
      };
      if (existingIdx >= 0) {
        votes[existingIdx] = newVote;
      } else {
        votes.push(newVote);
      }

      /* 计算状态 */
      var approveCount = votes.filter(function(v) { return v.decision === 'approved'; }).length;
      var rejectCount = votes.filter(function(v) { return v.decision === 'rejected'; }).length;
      var newStatus;
      if (approveCount > rejectCount) newStatus = 'approved';
      else if (rejectCount > approveCount) newStatus = 'rejected';
      else newStatus = 'pending';

      var updateData = {
        votes: votes,
        status: newStatus,
        version: currentVersion + 1,
        decided_at: newStatus !== 'pending' ? new Date().toISOString() : null
      };
      if (newStatus !== 'pending') {
        updateData.approver_id = user.id;
        updateData.approver_name = user.name;
        updateData.approver_avatar = user.avatar;
        updateData.comment = comment || '';
      } else {
        updateData.approver_id = null;
        updateData.approver_name = null;
        updateData.approver_avatar = null;
        updateData.comment = null;
      }

      /* 先乐观更新本地（UI 立刻响应） */
      req.votes = votes;
      req.status = newStatus;
      req.version = currentVersion + 1;
      if (newStatus !== 'pending') {
        req.approverId = user.id;
        req.approverName = user.name;
        req.approverAvatar = user.avatar;
        req.comment = comment || '';
        req.decidedAt = Date.now();
      } else {
        req.approverId = null;
        req.approverName = null;
        req.approverAvatar = null;
        req.comment = null;
        req.decidedAt = null;
      }
      render();

      /* 带版本号条件更新 + select 确认结果 */
      return sb.from('requests').update(updateData).eq('id', requestId).eq('version', currentVersion).select().then(function(result) {
        if (result.error) {
          /* version 列不存在（旧数据未迁移），降级为不带版本的更新 */
          if (result.error.code === '42703' || (result.error.message && result.error.message.indexOf('version') >= 0)) {
            return sb.from('requests').update({
              votes: votes, status: newStatus,
              decided_at: updateData.decided_at,
              approver_id: updateData.approver_id, approver_name: updateData.approver_name,
              approver_avatar: updateData.approver_avatar, comment: updateData.comment
            }).eq('id', requestId).then(function(r2) {
              if (r2.error) {
                showToast(r2.error.message, 'error');
                return { success: false };
              }
              return { success: true, status: newStatus, votes: votes };
            });
          }
          showToast(result.error.message, 'error');
          return { success: false };
        }

        var data = result.data || [];
        if (data.length === 0) {
          /* 版本冲突，有人抢先更新了 */
          if (retryCount >= MAX_RETRIES - 1) {
            showToast('投票冲突，请刷新页面后重试', 'error');
            return { success: false };
          }
          /* 从服务器拉取最新数据，然后重试 */
          return self.refreshRequestSingle(requestId).then(function() {
            return attempt(retryCount + 1);
          });
        }

        /* 更新成功，同步服务器版本 */
        if (data[0] && data[0].version !== undefined) {
          req.version = data[0].version;
        }
        return { success: true, status: newStatus, votes: votes };
      }).catch(function() {
        showToast('网络错误，请重试', 'error');
        return { success: false };
      });
    }

    return attempt(0);
  },

  /* 删除成员：先清理投票再删除，返回 Promise<{success, failedUpdates}> */
  removeMember: function(id) {
    var self = this;
    var member = this.getMember(id);
    if (member && member.isAdmin) return Promise.resolve({ success: false, reason: 'admin' });
    if (this.data.members.length <= 1) return Promise.resolve({ success: false, reason: 'last' });

    var memberName = member ? member.name : '';

    /* 先计算需要更新的申请（不改本地，等确认后再改） */
    var statusUpdates = [];
    self.data.requests.forEach(function(req) {
      var votes = req.votes || [];
      var newVotes = votes.filter(function(v) { return v.userId !== id; });
      if (newVotes.length !== votes.length) {
        var approveCount = newVotes.filter(function(v) { return v.decision === 'approved'; }).length;
        var rejectCount = newVotes.filter(function(v) { return v.decision === 'rejected'; }).length;
        var newStatus;
        if (approveCount > rejectCount) newStatus = 'approved';
        else if (rejectCount > approveCount) newStatus = 'rejected';
        else newStatus = 'pending';

        var decidedAt = null;
        var approverId = null, approverName = null, approverAvatar = null, comment = null;
        if (newStatus !== 'pending') {
          decidedAt = req.decidedAt ? new Date(req.decidedAt).toISOString() : new Date().toISOString();
          approverId = req.approverId;
          approverName = req.approverName;
          approverAvatar = req.approverAvatar;
          comment = req.comment;
        }

        statusUpdates.push({
          id: req.id, newVotes: newVotes, newStatus: newStatus,
          oldVotes: votes.slice(), oldStatus: req.status,
          oldDecidedAt: req.decidedAt,
          oldApproverId: req.approverId, oldApproverName: req.approverName,
          oldApproverAvatar: req.approverAvatar, oldComment: req.comment,
          decided_at: decidedAt,
          approver_id: approverId, approver_name: approverName,
          approver_avatar: approverAvatar, comment: comment
        });
      }
    });

    /* 步骤1：更新所有相关申请的投票 */
    var failedUpdates = [];
    var updatePromises = statusUpdates.map(function(u) {
      return sb.from('requests').update({
        votes: u.newVotes, status: u.newStatus, decided_at: u.decided_at,
        approver_id: u.approver_id, approver_name: u.approver_name,
        approver_avatar: u.approver_avatar, comment: u.comment
      }).eq('id', u.id).then(function(result) {
        if (result.error) {
          failedUpdates.push(u.id);
          return false;
        }
        /* 成功则更新本地 */
        var req = self.data.requests.find(function(r) { return r.id === u.id; });
        if (req) {
          req.votes = u.newVotes;
          req.status = u.newStatus;
          req.decidedAt = u.newStatus !== 'pending' ? (u.decided_at ? new Date(u.decided_at).getTime() : Date.now()) : null;
          req.approverId = u.approver_id;
          req.approverName = u.approver_name;
          req.approverAvatar = u.approver_avatar;
          req.comment = u.comment;
        }
        return true;
      }).catch(function() {
        failedUpdates.push(u.id);
        return false;
      });
    });

    return Promise.all(updatePromises).then(function() {
      /* 步骤2：删除成员 */
      return sb.from('members').delete().eq('id', id).then(function(result) {
        if (result.error) {
          showToast('删除成员失败: ' + result.error.message, 'error');
          /* 回滚已成功的申请更新 */
          statusUpdates.forEach(function(u) {
            if (failedUpdates.indexOf(u.id) < 0) {
              var req = self.data.requests.find(function(r) { return r.id === u.id; });
              if (req) {
                req.votes = u.oldVotes;
                req.status = u.oldStatus;
                req.decidedAt = u.oldDecidedAt;
                req.approverId = u.oldApproverId;
                req.approverName = u.oldApproverName;
                req.approverAvatar = u.oldApproverAvatar;
                req.comment = u.oldComment;
              }
            }
          });
          render();
          return { success: false };
        }

        /* 成功：从本地移除成员 */
        var idx = self.data.members.findIndex(function(m) { return m.id === id; });
        if (idx >= 0) self.data.members.splice(idx, 1);
        if (state.currentUser === id) {
          state.currentUser = null;
          localStorage.removeItem('fsp-user-id');
        }
        render();

        if (failedUpdates.length > 0) {
          showToast('已删除 ' + memberName + '，但有 ' + failedUpdates.length + ' 条申请投票清理失败，请刷新页面', 'warning');
          return { success: true, failedUpdates: failedUpdates };
        }
        return { success: true };
      });
    }).catch(function() {
      showToast('网络错误，删除失败', 'error');
      return { success: false };
    });
  },

  toggleMemberRole: function(id, role) {
    var self = this;
    var member = this.getMember(id);
    if (!member) return false;
    var oldApplicant = member.isApplicant;
    var oldApprover = member.isApprover;
    var wouldBeApplicant = role === 'isApplicant' ? !member.isApplicant : member.isApplicant;
    var wouldBeApprover = role === 'isApprover' ? !member.isApprover : member.isApprover;
    if (!wouldBeApplicant && !wouldBeApprover) return false;
    /* 乐观更新本地 */
    if (role === 'isApplicant') member.isApplicant = !member.isApplicant;
    if (role === 'isApprover') member.isApprover = !member.isApprover;
    render();

    var update = {};
    if (role === 'isApplicant') update.is_applicant = !oldApplicant;
    if (role === 'isApprover') update.is_approver = !oldApprover;
    sb.from('members').update(update).eq('id', id).then(function(result) {
      if (result.error) {
        /* 失败回滚 */
        var m = self.getMember(id);
        if (m) {
          m.isApplicant = oldApplicant;
          m.isApprover = oldApprover;
        }
        showToast(result.error.message, 'error');
        render();
      }
    }).catch(function() {
      var m = self.getMember(id);
      if (m) {
        m.isApplicant = oldApplicant;
        m.isApprover = oldApprover;
      }
      showToast('网络错误，修改失败', 'error');
      render();
    });
    return true;
  },

  updateMemberName: function(id, name) {
    var self = this;
    if (!name) return false;
    var member = this.getMember(id);
    var oldName = member ? member.name : '';
    /* 乐观更新本地 */
    if (member) member.name = name;

    sb.from('members').update({ name: name }).eq('id', id).then(function(result) {
      if (result.error) {
        /* 失败回滚 */
        var m = self.getMember(id);
        if (m) m.name = oldName;
        showToast(result.error.message, 'error');
        render();
      }
    }).catch(function() {
      var m = self.getMember(id);
      if (m) m.name = oldName;
      showToast('网络错误，修改失败', 'error');
      render();
    });
    return true;
  },

  updateMember: function(id, updates) {
    var self = this;
    var sbUpdates = {};
    if (updates.pin !== undefined) sbUpdates.pin = updates.pin;
    if (updates.name !== undefined) sbUpdates.name = updates.name;
    if (updates.avatar !== undefined) sbUpdates.avatar = updates.avatar;
    if (updates.is_applicant !== undefined) sbUpdates.is_applicant = updates.is_applicant;
    if (updates.is_approver !== undefined) sbUpdates.is_approver = updates.is_approver;
    if (updates.is_admin !== undefined) sbUpdates.is_admin = updates.is_admin;
    return sb.from('members').update(sbUpdates).eq('id', id).then(function(result) {
      if (result.error) { showToast(result.error.message, 'error'); throw result.error; }
      var m = self.getMember(id);
      if (m) { Object.keys(updates).forEach(function(k) { m[k] = updates[k]; }); }
      render();
    });
  },

  /* 删除申请：等待服务器确认，返回 Promise<{success}> */
  deleteRequest: function(requestId) {
    var self = this;
    var req = this.data.requests.find(function(r) { return r.id === requestId; });
    if (!req) return Promise.resolve({ success: false });

    /* 先乐观删除本地 */
    var idx = self.data.requests.findIndex(function(r) { return r.id === requestId; });
    if (idx >= 0) self.data.requests.splice(idx, 1);
    /* 同时移除本地收藏中的对应项 */
    self.data.favorites = self.data.favorites.filter(function(f) { return f.requestId !== requestId; });
    render();

    /* 先删收藏，再删申请 */
    return sb.from('favorites').delete().eq('request_id', requestId).catch(function() {}).then(function() {
      return sb.from('requests').delete().eq('id', requestId).then(function(result) {
        if (result.error) {
          /* 失败回滚 */
          if (idx >= 0) self.data.requests.splice(idx, 0, req);
          render();
          showToast(result.error.message, 'error');
          return { success: false };
        }
        return { success: true };
      });
    }).catch(function() {
      /* 失败回滚 */
      if (idx >= 0) self.data.requests.splice(idx, 0, req);
      render();
      showToast('网络错误，删除失败', 'error');
      return { success: false };
    });
  },

  clearAllData: function() {
    var self = this;
    return sb.from('requests').delete().neq('id', '').then(function() {
      sb.from('favorites').delete().neq('id', '').catch(function() {});
      return sb.from('members').delete().neq('id', 'm1').then(function(result) {
        if (result && result.error) throw result.error;
        /* 清理本地状态 */
        self.data.requests = [];
        self.data.favorites = [];
        self.data.members = self.data.members.filter(function(m) { return m.id === 'm1'; });
        if (state.currentUser && !self.getMember(state.currentUser)) {
          state.currentUser = null;
          localStorage.removeItem('fsp-user-id');
        }
        render();
      });
    });
  }
};

/* ===== 认证函数 ===== */
function handleRegister() {
  var name = document.getElementById('reg-name').value.trim();
  var pin = document.getElementById('reg-pin').value.trim();
  var pinConfirm = document.getElementById('reg-pin-confirm').value.trim();

  if (!name) { showToast('请输入昵称', 'error'); return; }
  if (name.length > 10) { showToast('昵称最多10个字', 'error'); return; }
  if (!pin || pin.length !== 4 || !/^\d{4}$/.test(pin)) { showToast('PIN码必须是4位数字', 'error'); return; }
  if (pin !== pinConfirm) { showToast('两次PIN码不一致', 'error'); return; }
  if (DB.data.members.find(function(m) { return m.name === name; })) {
    showToast('这个名字已被使用', 'error'); return;
  }

  var id = 'm' + Date.now();

    id: id, name: name, avatar: state.loginSelectedEmoji,
    is_applicant: true, is_approver: true, is_admin: false, pin: pin

function handleLogin() {
  var name = document.getElementById('login-name').value.trim();
  var pin = document.getElementById('login-pin').value.trim();

  if (!name) { showToast('请输入昵称', 'error'); return; }
  if (!pin) { showToast('请输入PIN码', 'error'); return; }

/* 压缩图片：最大800px宽，JPEG 0.7质量，目标<500KB */
function compressImage(file, callback) {
  if (!file || !file.type.startsWith('image/')) {
    showToast('请选择图片文件', 'error');
    callback(null);
    return;
  }
  var reader = new FileReader();
  reader.onerror = function() {
    showToast('图片读取失败', 'error');
    callback(null);
  };
  reader.onload = function(e) {
    var img = new Image();
    img.onerror = function() {
      showToast('图片解析失败', 'error');
      callback(null);
    };
    img.onload = function() {
      try {
        var canvas = document.createElement('canvas');
        var maxDim = 800;
        var w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = h * maxDim / w; w = maxDim; }
          else { w = w * maxDim / h; h = maxDim; }
        }
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(function(blob) {
          callback(blob);
        }, 'image/jpeg', 0.7);
      } catch(err) {
        showToast('图片处理失败', 'error');
        callback(null);
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* 上传图片到Supabase Storage */
function uploadVoteImage(blob, callback) {

  }).then(function(result) {
    if (result.error) {
      showToast('图片上传失败: ' + result.error.message, 'error');
      callback(null);
    } else {
      var url = sb.storage.from('vote-images').getPublicUrl(fileName).data.publicUrl;
      callback(url);
    }
  }).catch(function(err) {
    showToast('图片上传失败', 'error');
    callback(null);
  });
}

/* ===== 工具函数 ===== */
var Utils = {
  formatPrice: function(price) {
    var num = Number(price);
    if (num >= 10000) return '¥' + (num / 10000).toFixed(1) + '万';
    return '¥' + num.toLocaleString('zh-CN');
  },
  formatTime: function(ts) {
    if (!ts) return '';
    var diff = Date.now() - ts;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
    if (diff < 86400000 * 7) return Math.floor(diff / 86400000) + '天前';
    var d = new Date(ts);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  },
  escapeHtml: function(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
};

/* ===== Toast ===== */
function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toast-container');
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 2600);
}

/* ===== Modal ===== */
var modalContext = null;

function showApprovalModal(requestId, action) {
  var req = DB.data.requests.find(function(r) { return r.id === requestId; });
  if (!req) return;
  var user = DB.getCurrentUser();
  if (user && req.applicantId === user.id) {
    showToast('不能审批自己的申请', 'error');
    return;
  }
  /* 48小时投票截止检查：打开弹窗前就提示 */
  var deadline = req.createdAt + 48 * 60 * 60 * 1000;
  if (Date.now() > deadline) {
    showToast('该申请投票已截止（超过48小时），无法再投票', 'error');
    return;
  }
  modalContext = { requestId: requestId, action: action };
  var isApprove = action === 'approved';
  var votes = req.votes || [];
  var myVote = votes.find(function(v) { return v.userId === user.id; });

}

/* ===== 分享安利 ===== */
function showShareModal(requestId) {
  var req = DB.data.requests.find(function(r) { return r.id === requestId; });
  if (!req) return;

  var votes = req.votes || [];
  var approveCount = votes.filter(function(v) { return v.decision === 'approved'; }).length;
  var rejectCount = votes.filter(function(v) { return v.decision === 'rejected'; }).length;

  var shareText = '🌸 朋友安利时间！\n\n' +
    req.applicantAvatar + ' ' + req.applicantName + ' 推荐：\n' +
    '📦 ' + req.item + '\n' +
    '💰 ' + Utils.formatPrice(req.price) + '\n';
  if (req.reason) shareText += '💬 理由：' + req.reason + '\n';
  if (req.link) shareText += '🔗 ' + req.link + '\n';
  shareText += '\n✅ 已通过审批！';
  if (votes.length > 0) {
    shareText += '（' + approveCount + '人通过';
    if (rejectCount > 0) shareText += '，' + rejectCount + '人驳回';
    shareText += '）\n';
    /* 列出投票意见 */
    votes.forEach(function(v) {
      shareText += v.userAvatar + ' ' + v.userName + '：' + (v.decision === 'approved' ? '✅' : '❌');
      if (v.comment) shareText += ' - "' + v.comment + '"';
      if (v.imageUrl) shareText += ' [附图]';
      shareText += '\n';
    });
  } else {
    shareText += '\n';
  }
  shareText += '\n—— 来自「朋友购物审批站」';

  var encodedText = encodeURIComponent(shareText);
  var hasNativeShare = typeof navigator.share === 'function' || typeof navigator.canShare === 'function';
  var overlay = document.getElementById('modal-overlay');
  overlay.innerHTML =
    '<div class="modal-sheet">' +
      '<div class="modal-header">' +
        '<h3>📤 分享安利</h3>' +
        '<button class="modal-close" data-action="close-modal">✕</button>' +
      '</div>' +
      '<div class="share-preview">' + Utils.escapeHtml(shareText).replace(/\n/g, '<br>') + '</div>' +
      '<button class="btn btn-primary" data-action="copy-share" data-text="' + encodedText + '">📋 复制文字到剪贴板</button>' +
      (hasNativeShare
        ? '<button class="btn btn-ghost" data-action="native-share" data-text="' + encodedText + '" style="margin-top:8px">📤 系统分享（可发微信）</button>'
        : '<div style="margin-top:8px;padding:10px;background:var(--bg-input);border-radius:var(--radius-sm);font-size:12px;color:var(--text-secondary);text-align:center;line-height:1.6">💡 复制后打开微信，在聊天框长按粘贴即可发送</div>') +
    '</div>';
  overlay.classList.add('active');
}

function handleCopyShare(encodedText) {
  var text = decodeURIComponent(encodedText);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() {
      showToast('已复制到剪贴板', 'success');
    }).catch(function() {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('已复制到剪贴板', 'success');
  } catch (e) {
    showToast('复制失败，请手动复制', 'error');
  }
  document.body.removeChild(ta);
}

function handleNativeShare(encodedText) {
  var text = decodeURIComponent(encodedText);
  if (navigator.share) {
    navigator.share({ title: '朋友安利', text: text }).then(function() {
      showToast('分享成功', 'success');
    }).catch(function() {
      /* 用户取消分享，不做任何操作 */
    });
  } else {
    handleCopyShare(encodedText);
    showToast('已复制，打开微信粘贴即可发送', 'info');
  }
}

function renderApproval() {
  var user = DB.getCurrentUser();

  if (!user) return '<div class="empty-state"><div class="empty-icon">👤</div><div class="empty-text">请先登录</div></div>';

  /* 多人评审制：显示所有非自己发起的申请（不限状态，都可投票） */
  var allRequests = DB.data.requests;
  var allVotable = allRequests.filter(function(r) { return r.applicantId !== user.id; });
  var myOwn = allRequests.filter(function(r) { return r.applicantId === user.id && r.status === 'pending'; });

  /* 判断我是否投过票 */
  function hasMyVote(r) {
    var votes = r.votes || [];
    return votes.some(function(v) { return v.userId === user.id; });
  }

  /* 筛选 */
  var filter = state.approvalFilter || 'unvoted';
  var votable;
  if (filter === 'unvoted') {
    votable = allVotable.filter(function(r) { return r.status === 'pending' && !hasMyVote(r); });
  } else if (filter === 'voted') {
    votable = allVotable.filter(function(r) { return hasMyVote(r); });
  } else {
    votable = allVotable;
  }

  var filters = [
    { id: 'unvoted', label: '待我投票', count: allVotable.filter(function(r) { return r.status === 'pending' && !hasMyVote(r); }).length },
    { id: 'voted',   label: '我已投票', count: allVotable.filter(function(r) { return hasMyVote(r); }).length },
    { id: 'all',     label: '全部',     count: allVotable.length }
  ];

  var filterTabsHtml = '<div class="filter-tabs">' +
    filters.map(function(f) {
      return '<div class="filter-tab ' + (filter === f.id ? 'active' : '') + '" data-action="filter-approval" data-filter="' + f.id + '">' +
        f.label + (f.count > 0 ? '<span class="filter-count">' + f.count + '</span>' : '') +
      '</div>';
    }).join('') +
  '</div>';

  /* 投票规则说明（可折叠） */
  var rulesHtml =
    '<div class="card" style="margin-bottom:12px;padding:16px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer" data-action="toggle-rules">' +
        '<span style="font-weight:600;font-size:14px">📜 投票规则说明（新朋友点这里）</span>' +
        '<span style="font-size:16px;color:var(--text-tertiary)" id="rules-arrow">▼</span>' +
      '</div>' +
      '<div id="rules-detail" style="display:none;margin-top:12px;font-size:13px;color:var(--text-secondary);line-height:1.8">' +
        '<div style="margin-bottom:8px"><strong>🤔 这是什么？</strong><br>朋友之间互相把关的购物评审工具。买东西之前先发个申请，大家投票决定该不该买。</div>' +
        '<div style="margin-bottom:8px"><strong>📝 怎么发申请？</strong><br>点底部「发起申请」标签 → 填写物品名称、价格、购买理由 → 可以加图片和链接 → 提交后大家就能看到了</div>' +
        '<div style="margin-bottom:8px"><strong>🗳️ 怎么投票？</strong><br>在「投票」页面看到朋友的申请，点「通过」或「驳回」，可以写上理由和图片。投完票可以改主意重新投。</div>' +
        '<div style="margin-bottom:8px"><strong>⚖️ 结果怎么定？</strong><br>通过票数 &gt; 驳回票数 → 通过<br>驳回票数 &gt; 通过票数 → 驳回<br>票数相等 → 继续等待其他人投票<br>48小时内没投出结果 → 自动驳回</div>' +
        '<div style="margin-bottom:8px"><strong>🔄 可以改票吗？</strong><br>可以！随时可以修改你的投票，改票后结果会重新计算。</div>' +
        '<div style="margin-bottom:8px"><strong>🚫 能审自己的吗？</strong><br>不能。自己发起的申请不能自己投票，得等朋友来评。</div>' +
        '<div><strong>⏰ 截止规则</strong><br>申请提交后48小时内有效，超时未决自动驳回。所以看到有朋友发的新申请记得尽快投票哦！</div>' +
      '</div>' +
    '</div>';

  if (allVotable.length === 0 && myOwn.length === 0) {
    return filterTabsHtml + rulesHtml +
      '<div class="empty-state"><div class="empty-icon">🎉</div><div class="empty-text">还没有任何申请<br>快去发起第一个吧</div></div>';
  }

  var html = filterTabsHtml + rulesHtml;

  var hintText = '';
  if (!user.isApprover) {
    hintText = '📌 你当前不是审批人，仅可查看，无法投票';
  } else if (filter === 'unvoted') {
    hintText = '📌 你还没投票的申请：通过人数>驳回人数才通过，48小时内未决自动驳回';
  } else if (filter === 'voted') {
    hintText = '📌 你已参与投票的申请，仍可改票改变结果';
  } else {
    hintText = '📌 多人评审制：通过人数>驳回人数才通过，48小时内未决自动驳回，可改票';
  }

  if (votable.length > 0) {
    html += '<div style="margin-bottom:12px;color:var(--text-secondary);font-size:13px">' + hintText + '</div>';
    html += votable.map(function(r) { return renderRequestCard(r, { showActions: true }); }).join('');
  } else if (allVotable.length > 0) {
    var emptyTip = '暂无记录';
    if (filter === 'unvoted') emptyTip = '✅ 没有需要你投票的新申请';
    if (filter === 'voted') emptyTip = '你还没有投过任何票';
    html += '<div class="card" style="padding:24px;text-align:center;color:var(--text-tertiary);font-size:13px">' + emptyTip + '</div>';
  }

  if (myOwn.length > 0) {
    html += '<div class="section-title">⏳ 我的待审申请</div>';
    html += myOwn.map(function(r) { return renderRequestCard(r, { showActions: true }); }).join('');
  }
  return html;
}

function renderHistory() {

}

/* ===== 组件渲染 ===== */
function renderRequestCard(req, options) {
  options = options || {};
  var user = DB.getCurrentUser();
  var badgeMap = {
    pending:  '<span class="status-badge status-pending">⏳ 待审批</span>',
    approved: '<span class="status-badge status-approved">✅ 已通过</span>',
    rejected: '<span class="status-badge status-rejected">❌ 已驳回</span>'
  };
  var statusBadge = badgeMap[req.status] || '';

  var footer = '';
  var votes = req.votes || [];
  var approveVotes = votes.filter(function(v) { return v.decision === 'approved'; });
  var rejectVotes = votes.filter(function(v) { return v.decision === 'rejected'; });
  var myVote = user ? votes.find(function(v) { return v.userId === user.id; }) : null;
  var hasVoted = !!myVote;

  /* 投票统计条（有投票时显示） */
  var voteSummaryHtml = '';
  if (votes.length > 0) {
    voteSummaryHtml = '<div class="vote-summary">';
    if (approveVotes.length > 0) {
      voteSummaryHtml += '<span class="vote-chip approve">✅ ' + approveVotes.length + '人通过</span>';
    }
    if (rejectVotes.length > 0) {
      voteSummaryHtml += '<span class="vote-chip reject">❌ ' + rejectVotes.length + '人驳回</span>';
    }
    var totalVoters = votes.length;
    voteSummaryHtml += '<span class="vote-chip pending">🗳️ 共' + totalVoters + '人参与</span>';
    voteSummaryHtml += '</div>';
  }

  /* 投票详情列表 */
  var voteListHtml = '';
  if (votes.length > 0) {
    voteListHtml = '<div class="vote-list">';
    votes.forEach(function(v) {
      var isMe = user && v.userId === user.id;
      voteListHtml +=
        '<div class="vote-item">' +
          '<div class="vote-avatar">' + v.userAvatar + '</div>' +
          '<div class="vote-body">' +
            '<div class="vote-head">' +
              '<span class="vote-name">' + Utils.escapeHtml(v.userName) + '</span>' +
              (isMe ? '<span class="my-vote-tag">我</span>' : '') +
              '<span class="vote-badge ' + (v.decision === 'approved' ? 'approve' : 'reject') + '">' +
                (v.decision === 'approved' ? '通过' : '驳回') +
              '</span>' +
              '<span class="vote-time">' + Utils.formatTime(v.votedAt) + '</span>' +
            '</div>' +
            (v.comment
              ? '<div class="vote-comment">"' + Utils.escapeHtml(v.comment) + '"</div>'
              : '<div class="vote-no-comment">未填写意见</div>') +
            (v.imageUrl ? '<img src="' + v.imageUrl + '" class="vote-img-thumb" data-action="view-vote-image" data-url="' + v.imageUrl + '" alt="评审图片">' : '') +
          '</div>' +
        '</div>';
    });
    voteListHtml += '</div>';
  }

  /* 投票截止倒计时提示（待审批状态才显示） */
  var deadlineHtml = '';
  if (req.status === 'pending') {
    var deadlineTime = req.createdAt + 48 * 60 * 60 * 1000;
    var remaining = deadlineTime - Date.now();
    if (remaining > 0) {
      var hours = Math.floor(remaining / (60 * 60 * 1000));
      var mins = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
      if (votes.length > 0) {
        deadlineHtml = '<div style="font-size:12px;color:var(--warning);text-align:center;padding:6px 0;background:rgba(245,158,11,0.08);border-radius:6px;margin-bottom:8px">⏱️ 投票截止倒计时：剩余 ' + hours + '小时' + mins + '分（平票将自动驳回）</div>';
      } else {
        deadlineHtml = '<div style="font-size:12px;color:var(--text-tertiary);text-align:center;padding:6px 0;margin-bottom:8px">⏱️ 48小时内需完成投票</div>';
      }
    } else {
      deadlineHtml = '<div style="font-size:12px;color:var(--danger);text-align:center;padding:6px 0;background:rgba(239,68,68,0.08);border-radius:6px;margin-bottom:8px">⏱️ 投票已截止，正在自动处理...</div>';
    }
  }

  var shareBtn = req.status === 'approved'
    ? '<button class="btn btn-ghost" data-action="share-request" data-id="' + req.id + '" style="margin-top:8px;width:100%;font-size:13px">📤 分享安利</button>'
    : '';

  if (options.showActions && user && req.applicantId !== user.id && user.isApprover) {
    /* 多人评审制：审批人可投票，通过人数>驳回人数才通过 */
    footer = '<div class="approval-info">' + voteSummaryHtml + deadlineHtml + voteListHtml +
      '<div class="action-row">' +
        '<button class="btn btn-success" data-action="open-approve" data-id="' + req.id + '">' +
          (hasVoted && myVote.decision === 'approved' ? '✅ 已通过（改票）' : '✅ 通过') +
        '</button>' +
        '<button class="btn btn-danger" data-action="open-reject" data-id="' + req.id + '">' +
          (hasVoted && myVote.decision === 'rejected' ? '❌ 已驳回（改票）' : '❌ 驳回') +
        '</button>' +
      '</div>' + shareBtn + '</div>';
  } else if (options.showActions && user && req.applicantId === user.id) {
    /* 申请者自己：只看不能投 */
    footer = '<div class="approval-info">' + voteSummaryHtml + deadlineHtml + voteListHtml +
      '<div style="color:var(--text-tertiary);text-align:center;padding:8px 0">⏳ 等待朋友评审...</div>' +
      shareBtn + '</div>';
  } else {
    var favBtn = options.showFavorite && user
      ? '<button class="btn btn-ghost" data-action="toggle-favorite" data-id="' + req.id + '" style="margin-top:8px;width:100%;font-size:13px">' + (DB.isFavorited(req.id) ? '⭐ 已收藏' : '☆ 收藏') + '</button>'
      : '';
    footer = '<div class="approval-info">' + voteSummaryHtml + deadlineHtml + voteListHtml + favBtn + shareBtn +
    '</div>';
  }

  var linkHtml = '';
  if (req.link) {
    if (/^https?:\/\//i.test(req.link)) {
      /* 标准 http(s) 链接，可点击打开 */
      linkHtml = '<a href="' + Utils.escapeHtml(req.link) + '" target="_blank" rel="noopener" class="request-link">🔗 查看链接</a>';
    } else {
      /* 非标准链接（如淘宝淘口令），显示为可复制文本 */
      linkHtml = '<div class="request-link" style="cursor:pointer" data-action="copy-link" data-link="' + Utils.escapeHtml(req.link) + '">🔗 复制链接（淘宝口令请复制到淘宝App打开）</div>';
    }
  }
  var reqImageHtml = req.imageUrl ? '<img src="' + req.imageUrl + '" class="request-image" data-action="view-vote-image" data-url="' + req.imageUrl + '" alt="物品图片" style="width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:8px;cursor:pointer">' : '';
  var compactStyle = options.compact ? ' style="padding:12px"' : '';

  return '<div class="request-card"' + compactStyle + '>' +
    '<div class="request-header">' +
      '<div class="avatar">' + req.applicantAvatar + '</div>' +
      '<div class="user-info">' +
        '<div class="name">' + Utils.escapeHtml(req.applicantName) + '</div>' +
        '<div class="time">' + Utils.formatTime(req.createdAt) + '</div>' +
      '</div>' +
      statusBadge +
      (options.showDelete ? '<button class="req-delete-btn" data-action="delete-request" data-id="' + req.id + '">🗑️</button>' : '') +
    '</div>' +
    '<div class="request-item">' + Utils.escapeHtml(req.item) + '</div>' +
    '<div class="request-price">' + Utils.formatPrice(req.price) + '</div>' +
    linkHtml +
    reqImageHtml +
    '<div class="request-reason">' + Utils.escapeHtml(req.reason) + '</div>' +
    footer +
  '</div>';
}

/* ===== 主渲染 ===== */
function render() {
  var user = DB.getCurrentUser();

  if (!user) {
    renderLoginScreen();
    return;
  }

  var login = document.getElementById('login-screen');
  var app = document.getElementById('app');
  login.style.display = 'none';
  app.style.display = 'flex';

  renderHeader();
  renderTabBar();
  var content = document.getElementById('content');
  var html = '';
  switch (state.view) {
    case 'home':     html = renderHome();     break;
    case 'submit':   html = renderSubmit();   break;
    case 'approval': html = renderApproval(); break;
    case 'history':  html = renderHistory();  break;
    case 'mine':     html = renderMine();     break;
    case 'settings': html = renderSettings(); break;
    default:         html = renderHome();
  }
  content.innerHTML = html;
  content.scrollTop = 0;
}

/* ===== 事件处理 ===== */
var submittingRequest = false;
function handleSubmitRequest() {
  if (submittingRequest) return;
  var item = document.getElementById('form-item').value.trim();
  var price = document.getElementById('form-price').value.trim();
  var reason = document.getElementById('form-reason').value.trim();
  var link = document.getElementById('form-link').value.trim();

  if (!item) { showToast('请填写物品名称', 'error'); return; }
  if (!price || Number(price) <= 0) { showToast('请填写有效价格', 'error'); return; }
  if (!reason) { showToast('请填写购买理由', 'error'); return; }

  var imgIcon = document.querySelector('#req-img-area .img-uploading');
  if (imgIcon) { showToast('图片正在上传，请稍等', 'error'); return; }

  submittingRequest = true;
  showToast('正在提交...', 'info');

  DB.addRequest(item, price, reason, link, requestImageUrl).then(function(result) {
    submittingRequest = false;
    if (result && result.success) {
      requestImageUrl = null;
      requestImageRemoved = false;
      showToast('申请已提交，等待审批...', 'success');
      navigate('home');
    }
    /* 失败的情况 addRequest 里已经弹过 toast 了 */
  }).catch(function() {
    submittingRequest = false;
    showToast('提交异常，请重试', 'error');
  });
}

function handleConfirmAddMember() {
  if (!DB.isCurrentUserAdmin()) { showToast('只有管理员可以添加成员', 'error'); return; }
  var nameEl = document.getElementById('modal-member-name');
  var name = nameEl ? nameEl.value.trim() : '';
  if (!name) { showToast('请输入昵称', 'error'); return; }
  if (DB.data.members.find(function(m) { return m.name === name; })) {
    showToast('这个昵称已存在', 'error'); return;
  }
  if (!state.modalRoles.isApplicant && !state.modalRoles.isApprover) {
    showToast('请至少选择一个角色', 'error'); return;
  }
  showToast('正在添加...', 'info');
  DB.addMember(name, state.modalSelectedEmoji, state.modalRoles.isApplicant, state.modalRoles.isApprover).then(function(result) {
    if (result && result.success) {
      showToast('已添加成员 ' + name, 'success');
      closeModal();
    }
    /* 失败的情况 addMember 里已经弹过 toast 了 */
  });
}

function handleRemoveMember(id) {
  var currentUser = DB.getCurrentUser();
  if (!currentUser || !currentUser.isAdmin) { showToast('只有管理员可以删除成员', 'error'); return; }
  var member = DB.getMember(id);
  if (member && member.isAdmin) { showToast('管理员不可删除', 'error'); return; }
  if (DB.getMembers().length <= 1) { showToast('至少保留一个成员', 'error'); return; }
  if (member && window.confirm('确定删除 ' + member.name + ' 吗？')) {
    showToast('正在删除...', 'info');
    DB.removeMember(id).then(function(result) {
      if (result && result.success && !result.failedUpdates) {
        showToast('已删除 ' + member.name, 'success');
      }
      /* 失败或部分失败的情况 removeMember 里已经弹过 toast 了 */
    });
  }
}

function handleDeleteRequest(requestId) {
  if (!DB.isCurrentUserAdmin()) { showToast('仅管理员可删除记录', 'error'); return; }
  var req = DB.data.requests.find(function(r) { return r.id === requestId; });
  if (req && window.confirm('确定删除这条记录吗？')) {
    DB.deleteRequest(requestId).then(function(result) {
      if (result && result.success) {
        showToast('记录已删除', 'success');
      }
    });
  }
}

function handleConfirmDecision() {
  if (!modalContext) return;
  var comment = document.getElementById('modal-comment').value.trim();
  var requestId = modalContext.requestId;
  var action = modalContext.action;
  var savedVoteImageUrl = voteImageUrl;
  var req = DB.data.requests.find(function(r) { return r.id === requestId; });
  var wasChanging = req && req.votes && req.votes.some(function(v) { return v.userId === (DB.getCurrentUser() || {}).id; });
  var actionLabel = action === 'approved' ? '通过' : '驳回';

  /* 先关弹窗，保持响应感 */
  closeModal();

  DB.voteRequest(requestId, action, comment, savedVoteImageUrl).then(function(result) {
    if (result && result.success) {
      var req2 = DB.data.requests.find(function(r) { return r.id === requestId; });
      var votes = result.votes || (req2 && req2.votes) || [];
      var approveCount = votes.filter(function(v) { return v.decision === 'approved'; }).length;
      var rejectCount = votes.filter(function(v) { return v.decision === 'rejected'; }).length;

      var msg;
      if (wasChanging) {
        msg = '已修改你的投票为「' + actionLabel + '」 📝';
      } else {
        msg = '已提交投票：' + actionLabel + ' 🗳️';
      }

      var finalStatus = result.status || (req2 && req2.status);
      if (finalStatus === 'approved') {
        msg = '投票结果：' + approveCount + '通过 ' + rejectCount + '驳回，申请已通过 🎉';
      } else if (finalStatus === 'rejected') {
        msg = '投票结果：' + approveCount + '通过 ' + rejectCount + '驳回，申请已驳回';
      } else if (finalStatus === 'pending') {
        msg += '\n当前 ' + approveCount + '通过 ' + rejectCount + '驳回，平票中，等待更多人投票';
      }

      showToast(msg, finalStatus === 'approved' ? 'success' : 'info');
    }
    /* 失败的情况 voteRequest 里已经弹过 toast 了 */
    render();
  }).catch(function() {
    showToast('投票异常，请重试', 'error');
  });
}

function handleResetData() {
  if (!DB.isCurrentUserAdmin()) { showToast('仅管理员可清空数据', 'error'); return; }
  showClearDataModal();
}

/* ===== 一键备份 ===== */
function handleBackupData() {
  if (!DB.isCurrentUserAdmin()) { showToast('仅管理员可备份数据', 'error'); return; }
  showToast('正在准备备份数据...', 'info');
  var now = new Date();
  var ts = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0') + '_' +
    String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0');

  var backup = {
    backupTime: now.toISOString(),
    backupDate: ts,
    version: 'v7.2',
    members: DB.data.members,
    requests: DB.data.requests,
    favorites: DB.data.favorites
  };

  var json = JSON.stringify(backup, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '购物审批备份_' + ts + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('备份文件已下载，请存到微信文件传输助手', 'success');
}
